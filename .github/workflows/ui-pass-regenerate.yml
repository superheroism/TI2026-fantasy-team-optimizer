name: UI pass regenerate

on:
  push:
    branches:
      - ui/remove-confidence-badges
    paths:
      - '.github/workflows/ui-pass-regenerate.yml'
      - 'src/**'
      - 'site/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-confidence-badges
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          rm .github/workflows/ui-pass-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate UI pass artifacts"
          git push
