name: M6E expanded t2 production integration

on:
  push:
    branches: [agent/m6e-expanded-t2-production-integration]
    paths: [.github/m6e-run-request]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6e-expanded-t2-production-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Authoritative M6E benchmark matrix
        shell: bash
        run: |
          set +e
          node scripts/benchmark-m6e.mjs
          echo $? > /tmp/m6e-benchmark-status
          exit 0
      - name: Commit generated outputs and benchmark evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/expandedT2AdaptivePolicy.ts build docs benchmarks/m6e-production-integration-results.json benchmarks/m6e-production-integration-report.md
          if ! git diff --cached --quiet; then
            git commit -m "M6E: record Node 22 integration evidence"
            git push origin HEAD:agent/m6e-expanded-t2-production-integration
          fi
      - name: Enforce benchmark gates
        shell: bash
        run: test "$(cat /tmp/m6e-benchmark-status)" -eq 0
