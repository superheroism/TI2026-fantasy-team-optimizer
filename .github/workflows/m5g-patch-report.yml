name: M5G One-Shot Patch Report

on:
  push:
    branches: [agent/m5g-target-t3-robustness]
    paths: [.github/m5g-patch-report-request]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m5g-target-t3-robustness
      - name: Replace target-kernel summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('M5G_TARGET_T3_ROBUSTNESS.md')
          s=p.read_text()
          start=s.index('## Target-kernel / state-dependent work')
          end=s.index('## Failure classification')
          section='''## Target-kernel / state-dependent work

The exact-kernel diagnostics confirm that runtime variation is strongly state- and threshold-dependent rather than a single constant multiplier. The table below reports total target-kernel scenario checks and combinatorial target-search time for each completed oracle/candidate. Timed-out candidates intentionally have no completed-run kernel summary.

| Case | Oracle checks (B) | Oracle kernel s | Candidate checks (B) | Candidate kernel s |
|---|---:|---:|---:|---:|
| canonical-default-50k | 20.46 | 143.5 | 6.95 | 45.8 |
| canonical-default-55k | 25.98 | 158.4 | — | — |
| canonical-default-60k | 20.63 | 115.7 | 8.46 | 46.4 |
| holdout-01-50k | 38.01 | 256.3 | — | — |
| holdout-01-55k | 29.69 | 181.7 | — | — |
| holdout-01-60k | 16.50 | 108.0 | 7.01 | 42.8 |
| holdout-02-50k | 5.75 | 46.0 | 1.25 | 9.7 |
| holdout-02-55k | 12.53 | 84.6 | 3.72 | 24.5 |
| holdout-02-60k | 14.48 | 81.8 | 5.11 | 30.2 |
| holdout-03-50k | 15.19 | 103.4 | 4.16 | 29.6 |
| holdout-03-55k | 22.96 | 136.8 | 7.81 | 47.2 |
| holdout-03-60k | 19.09 | 107.8 | 7.39 | 42.3 |
| holdout-04-50k | 24.35 | 167.7 | — | — |
| holdout-04-55k | 25.85 | 134.6 | — | — |
| holdout-04-60k | 16.29 | 86.8 | 7.21 | 38.0 |
| holdout-05-50k | 19.46 | 142.6 | — | — |
| holdout-05-55k | 23.34 | 153.4 | — | — |
| holdout-05-60k | 18.37 | 92.3 | 7.52 | 36.0 |
| holdout-06-50k | 27.58 | 197.2 | — | — |
| holdout-06-55k | 33.39 | 219.1 | — | — |
| holdout-06-60k | 26.75 | 181.8 | — | — |
| holdout-07-50k | 23.46 | 150.6 | — | — |
| holdout-07-55k | 25.48 | 136.7 | — | — |
| holdout-07-60k | 17.63 | 88.2 | 7.62 | 37.1 |
| holdout-08-50k | 21.19 | 114.1 | 8.63 | 47.8 |
| holdout-08-55k | 17.68 | 91.8 | 7.25 | 35.1 |
| holdout-08-60k | 9.16 | 45.0 | 3.86 | 18.8 |

The heaviest oracle was `holdout-01 @ 50k` at 38.01 billion scenario checks; the lightest was `holdout-02 @ 50k` at 5.75 billion. The candidate reduces work substantially when it completes, but the 60-second failures span several fixtures and both 50k/55k targets, so there is no single threshold-only failure cluster. Full candidate-count, branch, pair/triple, suffix-bound, cache, preparation-time, DP/search, transition, and menu diagnostics remain preserved in the raw GitHub Actions case artifacts from run `31890281254`; the committed aggregate retains the fields needed to reproduce the report's summary tables.

'''
          p.write_text(s[:start]+section+s[end:])
          PY
          rm -f .github/m5g-patch-report-request .github/workflows/m5g-patch-report.yml
      - name: Commit report patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'M5G: document state-dependent target-kernel work'
          git push origin HEAD:agent/m5g-target-t3-robustness
