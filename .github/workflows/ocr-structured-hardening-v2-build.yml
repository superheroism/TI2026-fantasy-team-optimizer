name: OCR structured hardening v2 build
on:
  push:
    branches: [agent/ocr-structured-field-hardening-v2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/ocr-domain-match.test.mjs tests/screenshot-import.test.mjs
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          rm .github/workflows/ocr-structured-hardening-v2-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build docs .github/workflows
          git commit -m 'Synchronize generated OCR artifacts'
          git push
