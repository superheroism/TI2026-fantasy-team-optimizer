name: P52F correctness pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply P52F correctness patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f'missing patch anchor in {path}: {old[:160]}')
              p.write_text(s.replace(old,new))

          # Once extraction has independently re-localized the three role columns,
          # a coarse localization fallback is not a field-level confidence cap.
          replace('src/import/localScreenshotOcr.ts',
            "const geometryConfidenceCap=extractionGeometry.method==='fallback'||pooledResult.synthesized?.85:localGeometry.method==='fallback'?.92:1;",
            "const geometryConfidenceCap=extractionGeometry.method==='fallback'||pooledResult.synthesized?.85:1;")

          # Team/player evidence spans the role header and first card, not only the
          # narrow strip left of the emblem detail area.
          replace('src/import/localScreenshotOcr.ts',
            "tw=within(ex.words,Math.max(0,b.left-bandWidth*.08),Math.max(b.left,emblemLeft-bandWidth*.03),0,Math.min(ex.height,first+pitch*.7))",
            "tw=within(ex.words,Math.max(0,b.left-bandWidth*.04),Math.min(ex.width,b.right+bandWidth*.04),0,Math.min(ex.height,first+pitch*.7))")

          # Fuse closed-domain row evidence across field classes before declaring
          # the screenshot layout unresolved. This remains semantic evidence, not
          # a screenshot-size or browser-specific heuristic.
          p=Path('src/import/localScreenshotOcr.ts'); s=p.read_text()
          s=s.replace("type RowStream='tier'|'stat'|'trait'|'card';","type RowStream='tier'|'semantic'|'stat'|'trait'|'card';")
          old="function rowStreams(ws:readonly Word[],b:Band,height:number):Record<RowStream,number[]>{const tolerance=Math.max(10,Math.min(22,height*.018)),actionY=lineRecords(ws).filter(line=>norm(line.s).includes('REROLLOPERATIONS')||norm(line.s).includes('ROLLTOKENS')).map(line=>line.y).sort((a,b)=>a-b)[0]??height,lines=lineRecords(ws).filter(line=>line.x>=b.left&&line.x<b.right&&line.y<actionY),tier=tiers(ws.filter(word=>cy(word)<actionY),b,height),stat=clusteredYs(lines.filter(line=>matchStatText(line.s,ALL_STATS).score>=.58).map(line=>line.y),tolerance),trait=clusteredYs(lines.filter(line=>matchTraitText(line.s).score>=.62).map(line=>line.y),tolerance),card=clusteredYs(ws.filter(word=>cx(word)>=b.left&&cx(word)<b.right&&cy(word)<actionY&&cardAnchor(word)).map(cy),tolerance);return{tier,stat,trait,card};}"
          new="function rowStreams(ws:readonly Word[],b:Band,height:number):Record<RowStream,number[]>{const tolerance=Math.max(10,Math.min(22,height*.018)),actionY=lineRecords(ws).filter(line=>norm(line.s).includes('REROLLOPERATIONS')||norm(line.s).includes('ROLLTOKENS')).map(line=>line.y).sort((a,b)=>a-b)[0]??height,lines=lineRecords(ws).filter(line=>line.x>=b.left&&line.x<b.right&&line.y<actionY),tier=tiers(ws.filter(word=>cy(word)<actionY),b,height),stat=clusteredYs(lines.filter(line=>matchStatText(line.s,ALL_STATS).score>=.58).map(line=>line.y),tolerance),trait=clusteredYs(lines.filter(line=>matchTraitText(line.s).score>=.62).map(line=>line.y),tolerance),card=clusteredYs(ws.filter(word=>cx(word)>=b.left&&cx(word)<b.right&&cy(word)<actionY&&cardAnchor(word)).map(cy),tolerance),semantic=clusteredYs([...tier,...stat,...trait,...card],tolerance);return{tier,semantic,stat,trait,card};}"
          if old not in s:
              if new not in s: raise SystemExit('missing rowStreams anchor')
          else: s=s.replace(old,new)
          s=s.replace("streams:RowStream[]=['tier','stat','trait','card']","streams:RowStream[]=['tier','semantic','stat','trait','card']")
          p.write_text(s)

          # Calibration trusts the extraction geometry actually used for fields,
          # and combines team header evidence with the first role card.
          p=Path('src/import/screenshotImport.ts'); s=p.read_text()
          s=s.replace("  if(metrics.diagnostic.columnLocalizationMethod==='fallback') return {value:.92,reason:'geometry-fallback'};\n","")
          old="const teamPath=`banners.${role}.selectedTeam`,team=metrics.diagnostic.teamEvidence[role],teamRaw=confidenceFor(raw,teamPath),teamMatch=matchTeamEvidence(team.rawText,role,data);"
          new="const teamPath=`banners.${role}.selectedTeam`,team=metrics.diagnostic.teamEvidence[role],teamRaw=confidenceFor(raw,teamPath),teamCorpus=[team.rawText,...metrics.diagnostic.emblems.filter(emblem=>emblem.role===role&&emblem.rowIndex===0).map(emblem=>emblem.rawText)].filter(Boolean).join(' '),teamMatch=matchTeamEvidence(teamCorpus,role,data);"
          if old not in s:
              if new not in s: raise SystemExit('missing team evidence anchor')
          else: s=s.replace(old,new)
          s=s.replace("actionMatch.score>=.65&&actionMatch.margin>=.06","actionMatch.score>=.65&&actionMatch.margin>=.05")
          p.write_text(s)

          # Preserve short but diagnostic QUALITY fragments from dedicated action
          # crops. The candidate still must win the closed catalogue decisively.
          replace('src/import/ocrDomainMatch.ts',"QUALITY:['QUAL']","QUALITY:['QUAL','QUA','QU']")

          # Target team OCR around the role header/first-card band. Never let a weak
          # retry overwrite the board; calibration applies only strong separated
          # roster evidence after all evidence has been fused.
          p=Path('src/import/emblemOcrRefinement.ts'); s=p.read_text()
          old="for(const role of ROLES){const path=`banners.${role}.selectedTeam`;if(budget.exhausted||confidenceFor(raw,path)>=.9)continue;const band=metrics.diagnostic.columnBands[role],bw=band.right-band.left,teamLeft=Math.max(0,band.left-bw*.04),teamWidth=Math.min(metrics.extractionWidth-teamLeft,bw*1.04),teamHeight=Math.min(metrics.extractionHeight,Math.max(pitch*.75,first-pitch*.18)),rect=extractionToSource({left:teamLeft,top:0,width:teamWidth,height:teamHeight},metrics),teamCanvas=canvas(src,rect),rec=await recognize(w,teamCanvas,budget,`team:${role}`,6,rect),words=parse(rec.data.tsv),s=orderedText(words),match=teamMatch(s,role,data),confidence=combined(match.score,words);retries++;teamRetries++;metrics.diagnostic.teamEvidence[role]={rawText:s,normalizedTeam:match.team,matchScore:match.score};if(match.score>=.62&&confidence>confidenceFor(raw,path)){raw.banners[role].selectedTeam=match.team;setConfidence(raw,path,confidence);}}"
          new="for(const role of ROLES){const path=`banners.${role}.selectedTeam`;if(budget.exhausted||confidenceFor(raw,path)>=.9)continue;const band=metrics.diagnostic.columnBands[role],bw=band.right-band.left,teamLeft=Math.max(0,band.left-bw*.04),teamWidth=Math.min(metrics.extractionWidth-teamLeft,bw*1.04),teamTop=Math.max(0,first-pitch*.65),teamHeight=Math.min(metrics.extractionHeight-teamTop,pitch*1.45),rect=extractionToSource({left:teamLeft,top:teamTop,width:teamWidth,height:teamHeight},metrics),teamCanvas=canvas(src,rect),rec=await recognize(w,teamCanvas,budget,`team:${role}`,6,rect),words=parse(rec.data.tsv),s=orderedText(words),match=teamMatch(s,role,data),confidence=combined(match.score,words),prior=metrics.diagnostic.teamEvidence[role],combinedText=[prior.rawText,s].filter(Boolean).join(' ');retries++;teamRetries++;metrics.diagnostic.teamEvidence[role]={rawText:combinedText,normalizedTeam:match.team,matchScore:match.score};if(match.score>=.9&&confidence>=.9&&confidence>confidenceFor(raw,path)){raw.banners[role].selectedTeam=match.team;setConfidence(raw,path,confidence);}}"
          if old not in s:
              if new not in s: raise SystemExit('missing team retry anchor')
          else: s=s.replace(old,new)
          p.write_text(s)

          # Update/add focused contracts.
          p=Path('tests/p52-unresolved-semantics.test.mjs'); s=p.read_text()
          s=s.replace("actionMatch.score>=.65&&actionMatch.margin>=.06","actionMatch.score>=.65&&actionMatch.margin>=.05")
          marker="test('team auto-application requires candidate separation, not a fuzzy winner alone',()=>{"
          addition="""test('coarse localization fallback does not cap independently relocalized extraction fields',()=>{\n  assert.equal(source.includes("columnLocalizationMethod==='fallback'"),false);\n});\n\ntest('team evidence fuses the role header with first-card roster text',()=>{\n  assert.ok(source.includes('teamCorpus=['));\n  assert.ok(source.includes('emblem.rowIndex===0'));\n});\n\n"""
          if addition not in s:
              s=s.replace(marker,addition+marker)
          p.write_text(s)

          p=Path('tests/ocr-domain-match.test.mjs'); s=p.read_text()
          old="  assert.equal(matchActionText('AIT FOR RED REROLL QU LEMS RANDOM')?.id, 'red-quality-random');"
          new="  const clippedQuality=matchActionText('AIT FOR RED REROLL QU LEMS RANDOM');\n  assert.equal(clippedQuality?.id, 'red-quality-random');\n  assert.ok((clippedQuality?.score ?? 0) >= .65);\n  assert.ok((clippedQuality?.margin ?? 0) >= .05);"
          if old not in s:
              if new not in s: raise SystemExit('missing clipped quality test anchor')
          else: s=s.replace(old,new)
          p.write_text(s)

          p=Path('tests/retry-consolidation-contract.test.mjs'); s=p.read_text()
          marker="test('dedicated Tier retry remains bounded to unresolved or ambiguous Tier evidence',()=>{"
          addition="""test('team retry cannot overwrite the board from weak fuzzy evidence',()=>{\n  assert.match(refinement,/match\.score>=\.9&&confidence>=\.9/);\n  assert.match(refinement,/combinedText=\[prior\.rawText,s\]/);\n});\n\n"""
          if addition not in s:
              s=s.replace(marker,addition+marker)
          p.write_text(s)

          p=Path('tests/stat-row-retry-ui.test.mjs'); s=p.read_text()
          marker="test('successful stat retries synchronize final diagnostic stat values',()=>{"
          addition="""test('team retries target the first-card roster band rather than the page header',()=>{\n  assert.match(refinement,/teamTop=Math\.max\(0,first-pitch\*\.65\)/);\n  assert.match(refinement,/teamHeight=Math\.min\(metrics\.extractionHeight-teamTop,pitch\*1\.45\)/);\n});\n\n"""
          if addition not in s:
              s=s.replace(marker,addition+marker)
          p.write_text(s)

          # A source-level contract for cross-field semantic row fusion; behavioral
          # browser certification remains authoritative for parity.
          p=Path('tests/p52-direct-tier-application.test.mjs'); s=p.read_text()
          if "localScreenshotOcr" not in s:
              s=s.replace("const source=await readFile(new URL('../src/import/emblemOcrRefinement.ts',import.meta.url),'utf8');",
                          "const source=await readFile(new URL('../src/import/emblemOcrRefinement.ts',import.meta.url),'utf8');\nconst localScreenshotOcr=await readFile(new URL('../src/import/localScreenshotOcr.ts',import.meta.url),'utf8');")
              s += "\ntest('layout recovery fuses semantic row evidence across closed field classes',()=>{assert.ok(localScreenshotOcr.includes(\"semantic=clusteredYs([...tier,...stat,...trait,...card]\"));});\n"
          p.write_text(s)
          PY
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Commit source and generated output
        run: |
          if git diff --quiet -- src tests build docs; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests build docs
          git commit -m 'P52F harden team action and layout evidence'
          git pull --rebase origin agent/p52f-fast-accurate-low-review
          git push origin HEAD:agent/p52f-fast-accurate-low-review
