name: M6D Expanded t2 Adaptive Certification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/m6d-expanded-t2-adaptive-certification
    paths:
      - '.github/m6d-run-request'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to consume a closed M6D holdout twice
        run: |
          if [ -f benchmarks/m6d-selection.json ]; then
            node -e "const s=require('./benchmarks/m6d-selection.json'); if(s.holdoutConsumed) { console.error('M6D holdout already consumed'); process.exit(1); }"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Preflight tests
        run: npm run test:ci
      - name: Verify frozen production isolation before benchmark
        run: |
          git diff --exit-code 7757654ff91a4ca7a4f2fb7cad556620efc88140 -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
          node - <<'NODE'
          const c=require('./benchmarks/m6d-expanded-calibration-fixtures.json');
          const h=require('./benchmarks/m6d-expanded-holdout-fixtures.json');
          const p=require('./benchmarks/m6d-expanded-adaptive-candidates.json');
          for(const x of [c,h]) if(x.layoutId!=='expanded_5'||x.horizon!==2) throw Error('bad M6D corpus');
          if(p.productionEnabled!==false||p.horizon!==2) throw Error('adaptive policy must remain engineering-only');
          NODE
      - name: Run frozen calibration and exact oracles
        env:
          M6D_CASE_TIMEOUT_MS: 240000
        run: node scripts/benchmark-m6d.mjs --phase=calibration
      - name: Upload calibration evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6d-expanded-t2-calibration
          path: |
            benchmarks/m6d-expanded-calibration-fixtures.json
            benchmarks/m6d-expanded-holdout-fixtures.json
            benchmarks/m6d-expanded-adaptive-candidates.json
            benchmarks/m6d-expanded-calibration-results.json
            benchmarks/m6d-selection.json
          if-no-files-found: warn
      - name: Freeze calibration selection
        id: selection
        run: |
          CANDIDATE=$(node -p "require('./benchmarks/m6d-selection.json').selectedCandidate || ''")
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          cat benchmarks/m6d-selection.json
      - name: Commit calibration evidence before holdout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/m6d-expanded-calibration-results.json benchmarks/m6d-selection.json
          if git diff --cached --quiet; then echo 'No calibration changes'; else git commit -m 'M6D: record authoritative calibration'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Run one-shot holdout only for frozen qualifying candidate
        if: steps.selection.outputs.candidate != ''
        env:
          M6D_CASE_TIMEOUT_MS: 240000
        run: node scripts/benchmark-m6d.mjs --phase=holdout --candidate=${{ steps.selection.outputs.candidate }}
      - name: Upload holdout evidence immediately
        if: always() && steps.selection.outputs.candidate != ''
        uses: actions/upload-artifact@v4
        with:
          name: m6d-expanded-t2-holdout
          path: |
            benchmarks/m6d-expanded-holdout-fixtures.json
            benchmarks/m6d-expanded-adaptive-candidates.json
            benchmarks/m6d-expanded-holdout-results.json
            benchmarks/m6d-selection.json
          if-no-files-found: error
      - name: Commit holdout evidence
        if: steps.selection.outputs.candidate != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/m6d-expanded-holdout-results.json benchmarks/m6d-selection.json
          if git diff --cached --quiet; then echo 'No holdout changes'; else git commit -m 'M6D: record one-shot holdout'; git push origin HEAD:${GITHUB_REF_NAME}; fi
      - name: Verify isolation after benchmark
        if: always()
        run: |
          git diff --exit-code 7757654ff91a4ca7a4f2fb7cad556620efc88140 -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
          ! grep -R -E 'modeledHorizonOverride[[:space:]]*:[[:space:]]*[34]' scripts/m6d-*.mjs scripts/benchmark-m6d*.mjs
          ! grep -R -i 'm5h-target-holdout' scripts/m6d-*.mjs scripts/benchmark-m6d*.mjs
