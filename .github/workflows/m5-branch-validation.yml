name: M5 branch validation

on:
  push:
    branches: [agent/m5-four-token-experiment]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/m5-four-token-experiment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Rebuild generated artifacts
        run: npm run build

      - name: Commit generated artifacts when needed
        run: |
          if ! git diff --quiet -- build docs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build docs
            git commit -m "M5A: regenerate artifacts"
            git push
          fi

      - name: Verify generated artifacts
        run: npm run verify:generated

      - name: Run tests
        run: node --test tests/*.test.mjs
