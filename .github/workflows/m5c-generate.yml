name: M5C Regenerate
on:
  push:
    branches: [m5c-experiment]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[m5c generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build docs
          git commit -m 'M5C: regenerate artifacts [m5c generated]'
          git push origin HEAD:m5c-experiment
