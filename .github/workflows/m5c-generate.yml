name: M5C Calibration
on:
  push:
    branches: [m5c-experiment]
permissions:
  contents: write
jobs:
  fixture:
    if: "!contains(github.event.head_commit.message, '[m5c results]')"
    strategy:
      fail-fast: false
      matrix:
        fixture: [default, quality-heavy, stat-heavy, trait-heavy, global-quality, reachable-core-stat, reachable-support-trait, reachable-mid-quality, reachable-global-quality, reachable-two-step-a, reachable-two-step-b, reachable-two-step-c]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:generated
      - run: node --test tests/*.test.mjs
      - run: node scripts/benchmark-m5c-fixture.mjs '${{ matrix.fixture }}' --json='m5c-${{ matrix.fixture }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: m5c-${{ matrix.fixture }}
          path: m5c-${{ matrix.fixture }}.json
  aggregate:
    if: "!contains(github.event.head_commit.message, '[m5c results]')"
    needs: fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: m5c-*
          merge-multiple: true
          path: m5c-results
      - run: node scripts/aggregate-m5c-calibration.mjs m5c-results --json=benchmarks/m5c-depth-calibration.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/m5c-depth-calibration.json
          git commit -m 'M5C: record t3 calibration [m5c results]'
          git push origin HEAD:m5c-experiment
