name: M5C Generate Artifacts
on:
  push:
    branches: [m5c-depth-calibration]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5c-depth-calibration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M5C: regenerate build artifacts [generated]"
          git push origin HEAD:m5c-depth-calibration
