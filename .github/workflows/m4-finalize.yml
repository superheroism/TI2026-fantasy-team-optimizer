name: M4 Finalize Artifacts

on:
  push:
    branches:
      - agent/m4-dp-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[m4-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: M4 benchmark
        run: node scripts/benchmark.mjs --json=benchmarks/m4-dp-foundation-benchmark.json
      - name: Scenario prerequisite benchmark
        run: node scripts/benchmark-scenario-reuse.mjs --json=benchmarks/m4-scenario-prerequisite.json
      - name: Commit generated artifacts and benchmark reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs benchmarks/m4-dp-foundation-benchmark.json benchmarks/m4-scenario-prerequisite.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "M4: refresh generated artifacts and benchmarks [m4-generated]"
            git push
          fi
