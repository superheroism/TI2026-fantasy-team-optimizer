name: M4 Same Runner Comparison

on:
  push:
    branches:
      - agent/m4-dp-foundation

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out M4
        uses: actions/checkout@v4
        with:
          path: m4
      - name: Check out M3 main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: m3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build M3
        working-directory: m3
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install and build M4
        working-directory: m4
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Benchmark M3
        working-directory: m3
        run: node scripts/benchmark.mjs --json=/tmp/m3.json
      - name: Benchmark M4
        working-directory: m4
        run: node scripts/benchmark.mjs --json=/tmp/m4.json
      - name: Compare optimizer timings and semantics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/m3.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/m4.json','utf8'));
          const labels=['optimizer_default_cold','optimizer_default_warm','optimizer_quality_heavy_cold','optimizer_quality_heavy_warm','optimizer_stat_heavy_cold','optimizer_stat_heavy_warm','optimizer_global_quality_cold','optimizer_global_quality_warm','optimizer_trait_heavy_cold','optimizer_trait_heavy_warm','optimizer_target_55k_cold','optimizer_target_55k_warm'];
          const by=(report,label)=>report.results.find(row=>row.label===label);
          console.log('label\tM3 ms\tM4 ms\tchange\taction equal\tutility delta');
          for(const label of labels){
            const a=by(before,label),b=by(after,label);
            const pct=(b.ms/a.ms-1)*100;
            console.log(`${label}\t${a.ms.toFixed(3)}\t${b.ms.toFixed(3)}\t${pct.toFixed(1)}%\t${a.action===b.action}\t${(b.utility-a.utility).toExponential(3)}`);
          }
          NODE
