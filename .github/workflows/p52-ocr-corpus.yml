name: p52-ocr-corpus

on:
  pull_request:
    branches: [main]

concurrency:
  group: p52f-firefox-resolution-matrix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firefox-resolution-matrix:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Firefox diagnostic browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install firefox
      - name: Profile Board 2 localization resolutions
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import http from 'node:http';import path from 'node:path';import {firefox} from 'playwright';
          const boardPath=path.resolve('tests/test_boards/TI2026 - Board 2.png');
          const server=http.createServer((req,res)=>{if(req.url==='/board2.png'){res.writeHead(200,{'content-type':'image/png','cache-control':'no-store'});fs.createReadStream(boardPath).pipe(res);return;}res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});res.end('<!doctype html><meta charset="utf-8"><title>P52F Firefox resolution matrix</title>');});await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
          const origin=`http://127.0.0.1:${server.address().port}`,browser=await firefox.launch({headless:true}),page=await browser.newPage();await page.goto(origin);await page.addScriptTag({url:'https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js'});
          const report=await page.evaluate(async boardUrl=>{const img=new Image();img.src=boardUrl;await img.decode();const worker=await window.Tesseract.createWorker('eng');await worker.setParameters({tessedit_pageseg_mode:'3'});const rows=[];try{for(const maxWidth of [1100,900,800,700,600]){const k=Math.min(1,maxWidth/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*k);canvas.height=Math.round(img.naturalHeight*k);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const started=performance.now(),r=await worker.recognize(canvas,{}, {tsv:true}),elapsedMs=performance.now()-started,text=(r.data.text??'').toUpperCase(),tsv=r.data.tsv??'',words=tsv.split(/\r?\n/).slice(1).filter(line=>line.split('\t')[0]==='5'&&line.split('\t').slice(11).join('\t').trim()).length;rows.push({maxWidth,canvas:[canvas.width,canvas.height],pixels:canvas.width*canvas.height,elapsedMs,textLength:text.length,tsvLength:tsv.length,wordCount:words,anchors:{core:text.includes('CORE'),mid:text.includes('MID'),support:text.includes('SUPPORT'),tier:(text.match(/TIER/g)??[]).length,reroll:text.includes('REROLL'),tokens:text.includes('TOKENS')}});}return{browser:navigator.userAgent,rows};}finally{await worker.terminate();}},`${origin}/board2.png`);
          fs.writeFileSync('artifacts/p52f-firefox-resolution-matrix.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));await browser.close();await new Promise(resolve=>server.close(resolve));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52f-firefox-resolution-matrix
          path: artifacts/p52f-firefox-resolution-matrix.json
          if-no-files-found: error
