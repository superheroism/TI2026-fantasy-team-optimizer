name: p52-ocr-corpus

on:
  pull_request:
    branches: [main]

concurrency:
  group: p52f-tier-broad-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Tier-only broad-read skip
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/emblemOcrRefinement.ts')
          s=p.read_text()
          old="if(retryTier||retryTrait){const rr=extractionToSource({left:Math.max(0,d.roi.left-d.roi.width*.05),top:Math.max(0,d.roi.top-d.roi.height*.08),width:d.roi.width*1.08,height:d.roi.height*1.16},metrics),emblemCanvas=canvas(src,rr),rec=await recognize(w,emblemCanvas,budget,`emblem:${role}:${i+1}:psm6`,6,rr);words=parse(rec.data.tsv);ls=lines(words);retries++;emblemRetries++;}"
          new="if(retryTrait){const rr=extractionToSource({left:Math.max(0,d.roi.left-d.roi.width*.05),top:Math.max(0,d.roi.top-d.roi.height*.08),width:d.roi.width*1.08,height:d.roi.height*1.16},metrics),emblemCanvas=canvas(src,rr),rec=await recognize(w,emblemCanvas,budget,`emblem:${role}:${i+1}:psm6`,6,rr);words=parse(rec.data.tsv);ls=lines(words);retries++;emblemRetries++;}"
          if old not in s: raise SystemExit('missing broad retry anchor')
          p.write_text(s.replace(old,new))
          for f in ['tests/retry-consolidation-contract.test.mjs','tests/screenshot-refinement-contract.test.mjs']:
            p=Path(f); t=p.read_text(); t=t.replace('if(retryTier||retryTrait)','if(retryTrait)'); p.write_text(t)
          PY
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Run real-image regression gate
        run: node scripts/test-ocr-corpus.mjs --report-only --output=artifacts/p52f-tier-broad-skip.json
      - name: Enforce frozen readable-board safety
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('artifacts/p52f-tier-broad-skip.json','utf8'));
          const byName=new Map(report.results.map(r=>[r.sourceFile,r]));
          for(const name of ['TI2026 - Board 1.png','TI2026 - Board 2.png','TI2026 - Board 3.png','Ti2026 - board 6.png']){
            const r=byName.get(name);
            if(!r?.comparison?.exact) throw new Error(`${name} lost exact raw recognition`);
            if(r.comparison.falseHighConfidenceErrors!==0) throw new Error(`${name} introduced FHCE`);
          }
          const b5=byName.get('Ti2026 - board 5.webp');
          if(!b5||b5.comparison.statsExact!=='8/9'||b5.comparison.tiersExact!=='9/9'||b5.comparison.traitsExact!=='9/9'||b5.comparison.actionsExact!=='3/3'||!b5.comparison.tokenExact) throw new Error('Board 5 regressed');
          if(report.totals.falseHighConfidenceErrors!==0) throw new Error('Corpus introduced FHCE');
          NODE
      - name: Print timing summary
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='artifacts/p52f-tier-broad-skip.json';if(!fs.existsSync(p))process.exit(0);
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          for(const x of r.results) console.log(x.sourceFile,'exact=',x.comparison?.exact,'ms=',Math.round(x.elapsedMs??0),'calls=',x.ocrCalls,'FHCE=',x.comparison?.falseHighConfidenceErrors);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52f-tier-broad-skip
          path: artifacts/p52f-tier-broad-skip.json
          if-no-files-found: warn
