name: p52-ocr-corpus

on:
  push:
    branches:
      - agent/p52-real-image-ocr-recovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: p52-ocr-corpus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add P52 diagnostic fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-ocr-corpus.mjs')
          s=p.read_text()
          s=s.replace(
            "    roleColumnMethod:metrics?.diagnostic?.extractionColumnMethod ?? null,\n",
            "    roleColumnMethod:metrics?.diagnostic?.extractionColumnMethod ?? null,\n    roleGeometry:{localizationColumnCenters:metrics?.diagnostic?.localizationColumnCenters ?? null,extractionColumnCenters:metrics?.diagnostic?.extractionColumnCenters ?? null,localizationCrop:metrics?.diagnostic?.localizationCrop ?? null,sourceCrop:metrics?.diagnostic?.sourceCrop ?? null,columnBands:metrics?.diagnostic?.columnBands ?? null,roleCandidates:metrics?.diagnostic?.roleCandidates ?? [],cardAnchors:metrics?.diagnostic?.cardAnchors ?? []},\n    actionEvidence:metrics?.diagnostic?.actionEvidence ?? null,\n"
          )
          s=s.replace(
            "      normalizedStat:emblem.normalizedStat,normalizedTier:emblem.normalizedTier,\n      normalizedTrait:emblem.normalizedTrait,reviewRequired:emblem.reviewRequired,\n",
            "      normalizedStat:emblem.normalizedStat,normalizedTier:emblem.normalizedTier,\n      normalizedTrait:emblem.normalizedTrait,rawText:emblem.rawText,rawTierText:emblem.rawTierText,rawTraitText:emblem.rawTraitText,words:emblem.words,reviewRequired:emblem.reviewRequired,\n"
          )
          p.write_text(s)
          PY
      - name: Run current real-image OCR corpus
        run: node scripts/test-ocr-corpus.mjs --report-only --output=artifacts/p52-ocr-corpus-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52-ocr-corpus-results
          path: artifacts/p52-ocr-corpus-results.json
          if-no-files-found: warn
