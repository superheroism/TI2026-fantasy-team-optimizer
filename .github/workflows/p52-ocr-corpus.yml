name: p52-ocr-corpus

on:
  pull_request:
    branches: [main]

concurrency:
  group: p52f-firefox-file-input-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use original File for Firefox localization experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          old="else{const lc=canvas(img,LOCALIZE_MAX);local=await run(worker,lc,budget,'localization',{left:0,top:0,width:img.naturalWidth,height:img.naturalHeight});const box=cropBox(local,img.naturalWidth,img.naturalHeight);crop=box.source;localizationCrop=box.localization;localGeometry=box.geometry;const ec=canvas(img,EXTRACT_MAX,crop);ex=await run(worker,ec,budget,'extraction',crop);}"
          new="else{const lt=performance.now(),lr=await recognizeWithBudget(worker,file,budget,{stage:'localization-file',psm:3,crop:{left:0,top:0,width:img.naturalWidth,height:img.naturalHeight},canvasWidth:img.naturalWidth,canvasHeight:img.naturalHeight},{},{tsv:true},resetWorker);local={words:parse(lr.data.tsv),elapsedMs:performance.now()-lt,width:img.naturalWidth,height:img.naturalHeight};if(local.words.length===0)throw new Error(`EMPTY_FILE_LOCALIZATION textLen=${(lr.data.text??'').length} tsvLen=${(lr.data.tsv??'').length}`);const box=cropBox(local,img.naturalWidth,img.naturalHeight);crop=box.source;localizationCrop=box.localization;localGeometry=box.geometry;const ec=canvas(img,EXTRACT_MAX,crop);ex=await run(worker,ec,budget,'extraction',crop);if(ex.words.length===0)throw new Error('EMPTY_CANVAS_EXTRACTION_AFTER_FILE_LOCALIZATION');}"
          if old not in s: raise SystemExit('missing large-image localization branch')
          p.write_text(s.replace(old,new))
          PY
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.62.0
      - run: npx playwright install --with-deps firefox
      - name: Firefox Board 2 direct-File experiment
        env:
          SCREENSHOT_E2E_OUT: artifacts/firefox-board2
        run: node scripts/test-screenshot-e2e.mjs --browser=firefox --board2 --report-only
      - name: Print result
        if: always()
        run: |
          cat artifacts/firefox-board2/report.md || true
          node - <<'NODE'
          const fs=require('fs');const p='artifacts/firefox-board2/report.json';if(!fs.existsSync(p))process.exit(0);const r=JSON.parse(fs.readFileSync(p,'utf8'));for(const x of r.results)console.log(x.mode,JSON.stringify(x.stages?.rendered?.status));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52f-firefox-file-input
          path: artifacts/firefox-board2
          if-no-files-found: warn
