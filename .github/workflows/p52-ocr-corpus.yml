name: p52-ocr-corpus

on:
  pull_request:
    branches: [main]

concurrency:
  group: p52f-firefox-image-lifetime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep decoded Blob URL alive for Firefox experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          old="i.onload=()=>{URL.revokeObjectURL(u);ok(i);};"
          new="i.onload=()=>{ok(i);};"
          if old not in s: raise SystemExit('missing decode lifetime anchor')
          p.write_text(s.replace(old,new))
          PY
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.62.0
      - run: npx playwright install --with-deps firefox
      - name: Firefox Board 2 image-lifetime experiment
        env:
          SCREENSHOT_E2E_OUT: artifacts/firefox-board2
        run: node scripts/test-screenshot-e2e.mjs --browser=firefox --board2 --report-only
      - name: Print result
        if: always()
        run: cat artifacts/firefox-board2/report.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52f-firefox-image-lifetime
          path: artifacts/firefox-board2
          if-no-files-found: warn
