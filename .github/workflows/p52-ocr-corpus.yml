name: p52-ocr-corpus

on:
  pull_request:
    branches: [main]

concurrency:
  group: p52f-firefox-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instrument unresolved layout evidence locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          old="else throw new Error('Screenshot layout is unresolved; review is required.');"
          new="else throw new Error(`Screenshot layout is unresolved; review is required. evidence=${JSON.stringify(evidence)} global=${JSON.stringify(global)} perRole=${JSON.stringify(perRole)}`);"
          if old not in s: raise SystemExit('missing layout rejection anchor')
          p.write_text(s.replace(old,new))
          PY
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.62.0
      - run: npx playwright install --with-deps firefox
      - name: Firefox Board 2 diagnostic
        env:
          SCREENSHOT_E2E_OUT: artifacts/firefox-board2
        run: node scripts/test-screenshot-e2e.mjs --browser=firefox --board2 --report-only
      - name: Print Firefox failure evidence
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='artifacts/firefox-board2/report.json';
          if(!fs.existsSync(p)){console.log('no report');process.exit(0)}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          for(const x of r.results){
            console.log('\n',x.browser.name,x.board.sourceFile,x.mode);
            console.log('status=',x.stages?.rendered?.status);
            console.log('timeout=',x.timeout);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52f-firefox-row-evidence
          path: artifacts/firefox-board2
          if-no-files-found: warn
