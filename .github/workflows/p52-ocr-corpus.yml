name: p52-ocr-corpus

on:
  pull_request:
    branches:
      - main

concurrency:
  group: p52f-evidence-latency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  corpus:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply evidence and latency patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/p52f-evidence-latency-pass.yml').read_text()
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n",start)
          lines=workflow[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code,'p52f-evidence-latency-pass','exec'))
          PY
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Commit validated source and generated output
        run: |
          if git diff --quiet -- src tests build docs; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests build docs
          git commit -m 'P52F reuse decisive field evidence and skip duplicate OCR'
          git pull --rebase origin agent/p52f-fast-accurate-low-review
          git push origin HEAD:agent/p52f-fast-accurate-low-review
