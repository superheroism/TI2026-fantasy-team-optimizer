name: p52-ocr-corpus

on:
  pull_request:
    branches: [main]

concurrency:
  group: p52f-firefox-core-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firefox-core-v6:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply explicit Tesseract v6 core directory
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/localScreenshotOcr.ts'); s=p.read_text()
          old="interface Tess { createWorker(language?:string):Promise<Worker>; }"
          new="interface Tess { createWorker(language?:string,oem?:number,options?:{corePath?:string}):Promise<Worker>; }"
          if old not in s: raise SystemExit('missing Tess interface anchor')
          s=s.replace(old,new)
          old="const T=await runtime(),w=await T.createWorker('eng');"
          new="const T=await runtime(),w=await T.createWorker('eng',undefined,{corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0'});"
          if old not in s: raise SystemExit('missing createWorker anchor')
          p.write_text(s.replace(old,new))
          PY
      - run: npm run build
      - run: npm run typecheck
      - name: Install Firefox
        run: |
          npm install --no-save --package-lock=false playwright@1.62.0
          npx playwright install --with-deps firefox
      - name: Firefox Board 2 canary
        env:
          SCREENSHOT_E2E_OUT: artifacts/firefox-core-v6
          P52E_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/test-screenshot-e2e.mjs --board2 --browser=firefox --report-only
      - name: Require exact Firefox Board 2
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('artifacts/firefox-core-v6/report.json','utf8'));
          if(r.results.length!==3) throw new Error(`expected 3 runs, got ${r.results.length}`);
          for(const x of r.results){
            if(x.stages.raw===null||x.stages.validated===null||x.stages.applied===null) throw new Error(`${x.mode}: pipeline incomplete`);
            if(x.safety.timeout||x.safety.timeouts>0||x.safety.ocrErrors>0||x.safety.invalidGeometry>0||x.safety.budgetExhausted) throw new Error(`${x.mode}: OCR safety failure`);
            if(!x.comparison.rawExact||!x.comparison.validatedExact||!x.comparison.appliedExact||!x.comparison.renderExact) throw new Error(`${x.mode}: Board 2 not exact`);
            if(x.comparison.falseHighConfidenceErrors!==0) throw new Error(`${x.mode}: FHCE`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52f-firefox-core-v6
          path: artifacts/firefox-core-v6
          if-no-files-found: warn
