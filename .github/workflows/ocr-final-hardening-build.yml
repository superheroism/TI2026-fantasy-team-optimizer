name: OCR final hardening build
on:
  push:
    branches: [agent/ocr-final-fields-review-ui]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ocr-final-fields-review-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final OCR and review-UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/emblemOcrRefinement.ts')
          s=p.read_text()
          old="function setConfidence(raw:RawScreenshotImport,path:string,confidence:number):void{raw.fieldConfidence??=[];const old=raw.fieldConfidence.find(x=>x.path===path);if(old)old.confidence=Math.max(old.confidence,confidence);else raw.fieldConfidence.push({path,confidence} satisfies ScreenshotFieldConfidence);}"
          new=old+"\nfunction replaceConfidence(raw:RawScreenshotImport,path:string,confidence:number):void{raw.fieldConfidence??=[];const old=raw.fieldConfidence.find(x=>x.path===path);if(old)old.confidence=Math.max(0,Math.min(1,confidence));else raw.fieldConfidence.push({path,confidence:Math.max(0,Math.min(1,confidence))} satisfies ScreenshotFieldConfidence);}"
          assert old in s
          s=s.replace(old,new,1)
          old="function bestTierLine(ls:readonly Line[]):{match:{value:QualityTier;score:number};line?:Line}{let best:{match:{value:QualityTier;score:number};line?:Line}={match:{value:1,score:.2}};for(const line of ls){const match=matchTierText(line.text),hasTier=line.words.some(w=>ocrSimilarity(w.text,'TIER')>=.62),bonus=line.words.some(w=>/^\\+?(10|30|60|100|150)%$/.test(w.text.replace(/[“”'`]/g,''))),score=Math.min(.99,match.score+(hasTier ? .08 : 0)+(bonus ? .08 : 0));if(score>best.match.score)best={match:{value:match.value,score},line};}return best;}"
          new="function directTier(line:Line):{value:QualityTier;score:number}|undefined{const cleaned=line.words.map(w=>w.text.replace(/[“”'`]/g,'').toUpperCase()),bonus=cleaned.map(x=>x.match(/^\\+?(10|30|60|100|150)%$/)?.[1]).find(Boolean),bonusTier:Record<string,QualityTier>={'10':1,'30':2,'60':3,'100':4,'150':5};if(bonus)return{value:bonusTier[bonus]!,score:.99};const tierIndex=line.words.findIndex(w=>ocrSimilarity(w.text,'TIER')>=.62);if(tierIndex>=0){for(const token of cleaned.slice(tierIndex+1,tierIndex+3)){const roman=token.match(/^(I|II|III|IV|V)$/)?.[1];if(roman)return{value:({I:1,II:2,III:3,IV:4,V:5} as Record<string,QualityTier>)[roman]!,score:.97};}}return undefined;}\nfunction bestTierLine(ls:readonly Line[]):{match:{value:QualityTier;score:number};line?:Line;direct:boolean}{let best:{match:{value:QualityTier;score:number};line?:Line;direct:boolean}={match:{value:1,score:.2},direct:false};for(const line of ls){const exact=directTier(line);if(exact&&exact.score>best.match.score)best={match:exact,line,direct:true};else if(!best.direct){const match=matchTierText(line.text),hasTier=line.words.some(w=>ocrSimilarity(w.text,'TIER')>=.62),score=Math.min(.85,match.score+(hasTier ? .08 : 0));if(score>best.match.score)best={match:{value:match.value,score},line,direct:false};}}return best;}"
          assert old in s
          s=s.replace(old,new,1)
          old="const tier=bestTierLine(ls),qc=combined(tier.match.score,tier.line?.words??words);if(tier.match.score>=.72&&qc>confidenceFor(raw,qp)){raw.banners[role].emblems[i]!.qualityTier=tier.match.value;setConfidence(raw,qp,qc);d.normalizedTier=tier.match.value;d.tierMatchScore=tier.match.score;}"
          new="const tier=bestTierLine(ls),qc=combined(tier.match.score,tier.line?.words??words);if(tier.direct&&tier.match.score>=.72&&qc>confidenceFor(raw,qp)){raw.banners[role].emblems[i]!.qualityTier=tier.match.value;setConfidence(raw,qp,qc);d.normalizedTier=tier.match.value;d.tierMatchScore=tier.match.score;}else if(!tier.direct){const base=extractionToSource(d.roi,metrics),strip={left:base.left+base.width*.02,top:base.top+base.height*.30,width:base.width*.96,height:base.height*.38},tierRec=await w.recognize(canvas(src,strip),{tessedit_pageseg_mode:'7'},{tsv:true}),tierWords=parse(tierRec.data.tsv),tierLines=lines(tierWords),retryTier=bestTierLine(tierLines);retries++;emblemRetries++;if(retryTier.direct){const retryConfidence=combined(retryTier.match.score,retryTier.line?.words??tierWords);raw.banners[role].emblems[i]!.qualityTier=retryTier.match.value;replaceConfidence(raw,qp,retryConfidence);d.normalizedTier=retryTier.match.value;d.tierMatchScore=retryTier.match.score;}else replaceConfidence(raw,qp,Math.min(confidenceFor(raw,qp),.75));}"
          assert old in s
          s=s.replace(old,new,1)
          old="const groups=cluster3(words);if(groups){const cardTexts=groups.map(g=>orderedText(g)),resolved:[string|null,string|null,string|null]=[null,null,null];for(let i=0;i<3;i++){const match=matchActionText(cardTexts[i]??'');if(match&&match.score>=.58){resolved[i]=match.id;raw.operationIds[i]=match.id;setConfidence(raw,`operationIds.${i}`,match.score);}}metrics.diagnostic.actionEvidence={resolved,reason:resolved.every(Boolean)?'resolved-by-footer-clustering':'footer-clustering-partial',cardTexts};}else metrics.diagnostic.actionEvidence={resolved:[null,null,null],reason:'footer-action-clustering-underdetermined',cardTexts:[all]};"
          new="const centers=metrics.diagnostic.extractionColumnCenters,buttonCenters=[(centers.core+centers.mid)/2,centers.mid,(centers.mid+centers.support)/2],spacing=Math.min(buttonCenters[1]!-buttonCenters[0]!,buttonCenters[2]!-buttonCenters[1]!),sx=metrics.diagnostic.sourceCrop.width/metrics.extractionWidth,tokenWords=words.filter(x=>ocrSimilarity(x.text,'TOKENS')>=.62||/^\\d+$/.test(x.text)),tokenY=tokenWords.length?tokenWords.reduce((sum,x)=>sum+x.top+x.height/2,0)/tokenWords.length:footerRect.height*.88,buttonTop=Math.max(0,tokenY-footerRect.height*.34),buttonHeight=Math.min(footerRect.height-buttonTop,footerRect.height*.24),buttonWidth=spacing*sx*1.08,resolved:[string|null,string|null,string|null]=[null,null,null],cardTexts:string[]=[];for(let i=0;i<3;i++){const centerSource=metrics.diagnostic.sourceCrop.left+buttonCenters[i]!*sx,rect={left:centerSource-buttonWidth/2,top:footerRect.top+buttonTop,width:buttonWidth,height:buttonHeight},buttonRec=await w.recognize(canvas(src,rect),{tessedit_pageseg_mode:'6'},{tsv:true}),buttonWords=parse(buttonRec.data.tsv),buttonText=orderedText(buttonWords),match=matchActionText(buttonText);retries++;footerRetries++;cardTexts.push(buttonText);if(match&&match.score>=.58){resolved[i]=match.id;raw.operationIds[i]=match.id;setConfidence(raw,`operationIds.${i}`,match.score);}}metrics.diagnostic.actionEvidence={resolved,reason:resolved.every(Boolean)?'resolved-by-native-button-crops':'native-button-crops-partial',cardTexts};"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          css=Path('docs/screenshot-import.css')
          c=css.read_text()
          old='.emblem.screenshot-review-target-emblem{outline:1px solid var(--negative);outline-offset:-1px}'
          new='.emblem.screenshot-review-target-emblem{outline:3px solid var(--negative);outline-offset:-3px;box-shadow:0 0 0 1px color-mix(in srgb,var(--negative) 35%,transparent)}'
          assert old in c
          css.write_text(c.replace(old,new,1))
          PY
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/ocr-domain-match.test.mjs tests/screenshot-import.test.mjs
      - name: Commit generated artifacts and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/ocr-final-hardening-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/import/emblemOcrRefinement.ts docs/screenshot-import.css build docs .github/workflows/ocr-final-hardening-build.yml
          git commit -m "Finish structured screenshot OCR recovery and strengthen review outlines"
          git push origin HEAD:agent/ocr-final-fields-review-ui
