name: Publish v1.2.0

on:
  push:
    branches:
      - agent/release-1.2.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-1.2.0
          fetch-depth: 0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.2.0 already published."
          else
            gh release create v1.2.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "7106e5fc2f1b06b1d260ba074aaaa92c9f71bc39" \
              --title "v1.2.0" \
              --notes-file reference/RELEASE_NOTES_1.2.0.md
          fi
      - name: Record publication
        run: |
          if [ ! -f release_publish_tmp.txt ]; then
            printf 'v1.2.0 published from 7106e5fc2f1b06b1d260ba074aaaa92c9f71bc39\n' > release_publish_tmp.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release_publish_tmp.txt
            git commit -m "Record v1.2.0 publication"
            git push origin HEAD:agent/release-1.2.0
          fi
