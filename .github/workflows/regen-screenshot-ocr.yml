name: Regenerate screenshot OCR artifacts
on:
  push:
    branches: [agent/screenshot-ocr-corpus]
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[generated-ocr]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/screenshot-ocr-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit generated outputs and remove temporary workflow
        run: |
          rm .github/workflows/regen-screenshot-ocr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs .github/workflows/regen-screenshot-ocr.yml
          git commit -m "Regenerate screenshot OCR artifacts [generated-ocr]"
          git push origin HEAD:agent/screenshot-ocr-corpus
