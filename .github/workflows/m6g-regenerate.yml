name: M6G regenerate
on:
  push:
    branches: [agent/m6g-ui-application-decomposition]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6g-ui-application-decomposition
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit generated output if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs
          if git diff --cached --quiet; then
            echo "Generated output already current."
          else
            git commit -m "build: regenerate M6G deployment output"
            git push origin HEAD:agent/m6g-ui-application-decomposition
          fi
