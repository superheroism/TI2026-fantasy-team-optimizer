name: M6G regenerate
on:
  push:
    branches: [agent/m6g-ui-application-decomposition]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6g-ui-application-decomposition
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/update-m6g-roadmap.mjs
      - name: Commit generated output and roadmap if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs ENGINEERING_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Generated output and roadmap already current."
          else
            git commit -m "build: refresh M6G generated output and roadmap"
            git push origin HEAD:agent/m6g-ui-application-decomposition
          fi
