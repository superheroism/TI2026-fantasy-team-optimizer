name: M6A final compatibility fix

on:
  push:
    branches: [agent/m6a-versioned-board-layout]
    paths: ['.github/workflows/m6a-final-compat-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6a-versioned-board-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore low-level legacy codec compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/engine/stateEncoding.ts')
          s=p.read_text()
          s=s.replace("  if(emblem.color!==slot.color)throw new Error(`Expected ${layoutId}/${role} slot ${position} color ${slot.color}, got ${emblem.color}.`);", "  if(emblem.color!==slot.color){const prefix=layoutId==='legacy_3'?`${role} slot ${position}`:`${layoutId}/${role} slot ${position}`;throw new Error(`Expected ${prefix} color ${slot.color}, got ${emblem.color}.`);}")
          s=s.replace("  const stats=banner.emblems.map(emblem=>emblem.stat);if(new Set(stats).size!==stats.length)throw new Error(`${layoutId}/${banner.role} contains duplicate stats.`);\n", "")
          p.write_text(s)

          p=Path('tests/team-comparison-cache.test.mjs')
          s=p.read_text().replace("assert.match(keyLine,/bannerMechanicsKey\\(banner\\)/);", "assert.match(keyLine,/bannerMechanicsKey\\(banner/);")
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit source, test, and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/stateEncoding.ts tests/team-comparison-cache.test.mjs build docs
          git commit -m "M6A: restore legacy codec compatibility"
          git push origin HEAD:agent/m6a-versioned-board-layout
