name: Apply native-small OCR strategy
on:
  push:
    branches: [agent/screenshot-import-speed-confidence]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/screenshot-import-speed-confidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply native-small-image single-pass strategy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          s=s.replace("const LOCALIZE_MAX=1100, EXTRACT_MAX=1440;", "const LOCALIZE_MAX=1100, EXTRACT_MAX=1440, DIRECT_NATIVE_MAX_PIXELS=2_000_000;")
          needle="async function run(w:Worker,c:HTMLCanvasElement):Promise<Pass>{const t=performance.now(),r=await w.recognize(c,{}, {tsv:true});return{words:parse(r.data.tsv),elapsedMs:performance.now()-t,width:c.width,height:c.height};}"
          helper=needle+"\nfunction cropRecognizedPass(p:Pass,c:{left:number;top:number;width:number;height:number}):Pass{const words=p.words.filter(w=>cx(w)>=c.left&&cx(w)<c.left+c.width&&cy(w)>=c.top&&cy(w)<c.top+c.height).map(w=>({...w,left:w.left-c.left,top:w.top-c.top}));return{words,elapsedMs:0,width:c.width,height:c.height};}"
          if needle not in s: raise SystemExit('run helper insertion point not found')
          s=s.replace(needle,helper)
          old="export async function parseScreenshotLocally(file:File,data:DataBundle):Promise<LocalScreenshotOcrOutput>{const start=performance.now(),img=await decode(file),worker=await getWorker(),lc=canvas(img,LOCALIZE_MAX),local=await run(worker,lc),crop=cropBox(local,img.naturalWidth,img.naturalHeight),ec=canvas(img,EXTRACT_MAX,crop),ex=await run(worker,ec),bs=bands(ex.words,ex.width),rows="
          new="export async function parseScreenshotLocally(file:File,data:DataBundle):Promise<LocalScreenshotOcrOutput>{const start=performance.now(),img=await decode(file),worker=await getWorker(),nativePixels=img.naturalWidth*img.naturalHeight;let local:Pass,ex:Pass,crop:{left:number;top:number;width:number;height:number};if(nativePixels<=DIRECT_NATIVE_MAX_PIXELS){const native=canvas(img,Number.POSITIVE_INFINITY);local=await run(worker,native);crop=cropBox(local,img.naturalWidth,img.naturalHeight);ex=cropRecognizedPass(local,crop);}else{const lc=canvas(img,LOCALIZE_MAX);local=await run(worker,lc);crop=cropBox(local,img.naturalWidth,img.naturalHeight);const ec=canvas(img,EXTRACT_MAX,crop);ex=await run(worker,ec);}const bs=bands(ex.words,ex.width),rows="
          if old not in s: raise SystemExit('parse prefix not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - run: npm run typecheck && npm run lint && npm run build
      - name: Commit source and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/import/localScreenshotOcr.ts build docs
          git commit -m "Use one native OCR pass for small screenshots"
          git push origin HEAD:agent/screenshot-import-speed-confidence
