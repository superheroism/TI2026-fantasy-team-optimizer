name: p52-board6-tier-glyph-experiment

on:
  push:
    branches:
      - agent/p52-final-ocr-certification

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52-final-ocr-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .p52-board6-patch.py
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Run focused OCR tests
        run: node --test tests/p52-tier-glyph-retry.test.mjs tests/p52-direct-tier-application.test.mjs tests/p52-exact-stat-evidence.test.mjs tests/p52-stat-psm6.test.mjs tests/retry-consolidation-contract.test.mjs tests/ocr-image-preprocess.test.mjs tests/stat-row-retry-ui.test.mjs
      - name: Remove experiment debris and commit generated mirrors
        run: |
          rm .github/workflows/p52-board6-tier-glyph-experiment.yml
          rm -f .p52-board6-tier-glyph-trigger .p52-board6-patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P52: add bounded direct Tier glyph recovery"
          git push origin HEAD:agent/p52-final-ocr-certification
