name: P52F materialize generated output

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/p52f-fast-accurate-low-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52f-fast-accurate-low-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated artifacts if changed
        run: |
          if git diff --quiet -- build docs; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build docs
          git commit -m 'P52F materialize generated output'
          git push origin HEAD:agent/p52f-fast-accurate-low-review
