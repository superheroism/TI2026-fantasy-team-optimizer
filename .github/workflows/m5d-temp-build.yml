name: M5D temporary build

on:
  push:
    branches: [agent/m5d-progressive-action-widening]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[m5d-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build and test
        run: |
          npm run build
          npm run typecheck
          node --test tests/*.test.mjs
      - name: Freeze M5D holdout fixtures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { ACTION_CATALOG } from './docs/js/data/actionCatalog.js';
          import { defaultBoard } from './docs/js/data/defaultState.js';
          import { enumerateEngineOperation } from './docs/js/engine/compactTransitions.js';
          import { SeededRandom } from './docs/js/engine/random.js';
          import { boardToEngineState } from './docs/js/engine/stateEncoding.js';
          const rng=new SeededRandom(20260813),roles=['core','mid','support'];
          const fixtures=[],rejected=[],seen=new Set([String(boardToEngineState(defaultBoard).id)]);
          const pick=list=>list[Math.min(list.length-1,Math.floor(rng.uniform()*list.length))];
          let draw=0;
          while(fixtures.length<8){
            draw++;let engine=boardToEngineState(defaultBoard);const mutations=[];const steps=fixtures.length<4?1:2;let reason='';
            for(let step=0;step<steps;step++){
              const role=pick(roles),operation=pick(ACTION_CATALOG),outcomes=enumerateEngineOperation(engine,role,operation,true);
              if(!outcomes.length){reason=`illegal ${role}/${operation.id}`;break;}
              const outcomeIndex=Math.min(outcomes.length-1,Math.floor(rng.uniform()*outcomes.length));
              const next=outcomes[outcomeIndex].nextState;
              mutations.push({role,operationId:operation.id,outcomeIndex,outcomeCount:outcomes.length,beforeBoardId:String(engine.id),afterBoardId:String(next.id)});engine=next;
            }
            const finalBoardId=String(engine.id);
            if(reason||seen.has(finalBoardId)){rejected.push({draw,reason:reason||`duplicate ${finalBoardId}`,mutations});continue;}
            const menu=[];while(menu.length<3){const id=pick(ACTION_CATALOG).id;if(!menu.includes(id))menu.push(id);}
            seen.add(finalBoardId);fixtures.push({name:`holdout-${String(fixtures.length+1).padStart(2,'0')}`,steps,menu,mutations,finalBoardId});
          }
          fs.writeFileSync('benchmarks/m5d-holdout-fixtures.json',JSON.stringify({seed:20260813,algorithm:'SeededRandom; first four one-step, final four two-step; reject only illegal transitions or duplicate final board IDs',fixtures,rejectedDraws:rejected},null,2)+'\n');
          NODE
      - name: Commit generated artifacts and frozen holdout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs benchmarks/m5d-holdout-fixtures.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M5D: freeze generated artifacts and holdout [m5d-generated]"
          git push
