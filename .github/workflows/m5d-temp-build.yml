name: M5D temporary build

on:
  push:
    branches: [agent/m5d-progressive-action-widening]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[m5d-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build and test
        run: |
          npm run build
          npm run typecheck
          node --test tests/*.test.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M5D: refresh generated artifacts [m5d-generated]"
          git push
