name: M5D Outcome A Package

on:
  push:
    branches:
      - agent/m5e-terminal-composition
    paths:
      - .github/workflows/m5e-package.yml
      - benchmarks/m5e-package-run-request.txt

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/m5e-terminal-composition

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download authoritative M5D revalidation
        uses: actions/download-artifact@v4
        with:
          name: m5e-full-revalidation-31846345834
          path: /tmp/m5d-revalidation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: superheroism/TI2026-fantasy-team-optimizer
          run-id: 31846345834

      - name: Download regenerated engine outputs
        uses: actions/download-artifact@v4
        with:
          name: m5e-generated-31846812404
          path: /tmp/m5d-generated
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: superheroism/TI2026-fantasy-team-optimizer
          run-id: 31846812404

      - name: Install authoritative reports and generated output
        run: |
          cp /tmp/m5d-revalidation/m5d-proxy-rank-diagnostics.json benchmarks/
          cp /tmp/m5d-revalidation/m5d-widening-calibration.json benchmarks/
          cp /tmp/m5d-revalidation/m5d-widening-holdout.json benchmarks/
          cp /tmp/m5d-revalidation/m5d-four-token-benchmark.json benchmarks/
          cp -f /tmp/m5d-generated/build/js/engine/engineExpectedScoring.js build/js/engine/
          cp -f /tmp/m5d-generated/build/js/engine/engineExpectedScoring.js.map build/js/engine/
          cp -f /tmp/m5d-generated/build/js/engine/title.js build/js/engine/
          cp -f /tmp/m5d-generated/build/js/engine/title.js.map build/js/engine/
          cp -f /tmp/m5d-generated/docs/js/engine/engineExpectedScoring.js docs/js/engine/
          cp -f /tmp/m5d-generated/docs/js/engine/engineExpectedScoring.js.map docs/js/engine/
          cp -f /tmp/m5d-generated/docs/js/engine/title.js docs/js/engine/
          cp -f /tmp/m5d-generated/docs/js/engine/title.js.map docs/js/engine/

      - name: Record Outcome A documentation
        shell: python
        run: |
          from pathlib import Path

          m5d = '''# M5D — Progressive Action Widening

          ## Result

          **Outcome A.** The frozen M5D progressive-action-widening experiment passes calibration, holdout, and four-token feasibility gates after two exact scoring hot-path optimizations removed avoidable terminal-composition overhead.

          The selected engineering policy is **Wide `12 → 8 → 4`**, layered on the frozen M5C aggressive continuation-outcome schedule **`4 → 2 → 1`**. Production remains capped at **two modeled token spends**; M5C/M5D approximations remain engineering-only and disabled by default.

          ## Approximation boundary

          M5D leaves the root/current visible menu untouched. Current-menu actions still evaluate every legal role with the full continuation path. Stop, menu reroll, token accounting, Dota mechanics, compact transition identity, scoring semantics, and the exact menu operator are unchanged.

          For future fresh-menu states with more than one spend remaining, M5D:

          1. computes a one-spend shallow value for every legal operation identity across every legal role;
          2. ranks operations by descending shallow utility with stable operation-ID tie-breaking;
          3. recursively deepens only the configured top K operations;
          4. retains the shallow value for legal operations outside K;
          5. sends all 20 operation values to the exact uniform best-of-three menu operator.

          Deferred legal operations are therefore never deleted, renormalized, or replaced by stop/zero/negative infinity. The M5D option is structurally ignored at modeled horizons `t<=2`.

          ## Frozen policies

          M5C aggressive continuation compression remains fixed at `4 → 2 → 1` retained fresh-menu outcome strata by recursive depth.

          | M5D policy | Deep operation cap by recursive depth |
          |---|---|
          | Wide | 12 → 8 → 4 |
          | Medium | 8 → 5 → 3 |
          | Narrow | 5 → 3 → 2 |

          Depths beyond the listed schedule reuse the final cap. The widest passing policy is selected; no schedule was retuned after the measurement lock.

          ## Exact hot-path fixes before final revalidation

          The initial frozen M5D run passed calibration and holdout but missed the four-token gate because `stat-heavy` exceeded 60 seconds. A natural-completion profile measured about 81.8 seconds and showed that transition generation and raw stochastic generation were not the dominant costs.

          Two exact scoring optimizations were then applied without changing reachable states, transition probabilities, objective, widening policy, or recommendation semantics:

          - terminal expected-score composition now uses prefix-aligned dense values instead of repeated linear `.find()` scans across role frontiers;
          - title-prefix boost lookup takes a direct fast path for already-canonical team names, while preserving the existing roster-alias fallback.

          The compact expected scorer remains exactly equivalent to descriptive-board expected scoring in regression coverage, and title tests cover both canonical and alias lookup behavior.

          ## Calibration

          The final authoritative revalidation used the frozen 12-case calibration corpus and the original measurement lock. Wide was the widest passing policy.

          | Policy | Top-action agreement | Max oracle regret | Median runtime / oracle | Median runtime / M5C aggressive |
          |---|---:|---:|---:|---:|
          | Wide | **12/12** | **0** | **0.471×** | **0.756×** |
          | Medium | 12/12 | 0 | faster than Wide | faster than Wide |
          | Narrow | 11/12 | 408.9 | faster than Medium | faster than Medium |

          The frozen selection rule therefore chooses **Wide**, not the fastest schedule.

          ## Holdout

          The eight-case holdout was frozen before calibration with seed `20260813` and was not used to tune K.

          Combined across 12 calibration + 8 holdout cases:

          - top-action agreement: **19/20 = 95%**;
          - maximum oracle regret: **383.53**;
          - mean normalized regret: **0.050**;
          - disagreements with oracle top-two gap >1,000: **0**;
          - stop/menu bias: **none**;
          - disagreement-family concentration: **none**.

          The sole disagreement is `holdout-05`, where oracle and Wide choose different roles for the same red-quality-random operation family. Its oracle regret is 383.53, within the frozen near-tie allowance.

          ## Proxy-rank diagnostic

          Across 24 frozen proxy observations:

          - shallow rank 1 contains the deep winner: **83.3%**;
          - shallow top 3 contains the deep winner: **100%**;
          - shallow top 5/8/12 contains the deep winner: **100%**.

          At recursive depth 1, top-3 coverage is 12/12; at depth 2, rank-1 coverage is 12/12. This diagnostic supports the widening proxy but is not itself an Outcome A/B gate.

          ## M5C interaction sentinel

          The three frozen interaction sentinels (`default`, `stat-heavy`, `reachable-two-step-b`) preserve the oracle winner with zero regret under aggressive M5C outcome fidelity plus Wide M5D widening.

          ## Four-token feasibility

          All five required expected-score `t=4` fixtures completed under the unchanged 60-second ceiling in the authoritative revalidation:

          | Fixture | Runtime |
          |---|---:|
          | default | **31.86 s** |
          | quality-heavy | **36.87 s** |
          | stat-heavy | **48.22 s** |
          | trait-heavy | **29.35 s** |
          | global-quality | **31.36 s** |

          This satisfies the M5D four-token feasibility gate. It does not imply that production should immediately switch to a four-token horizon.

          ## Correctness and production isolation

          The implementation preserves full root/current-menu fidelity and exact `t<=2` semantics. Regression coverage includes complete expected-score and target-probability ranked-table equality at horizons one and two when widening is supplied, deterministic tie handling, all-operation menu vectors, shallow fallback behavior, and a delayed-upside synthetic case.

          Production remains unchanged: the normal optimizer is still capped at two modeled token spends, and the M5C/M5D approximation options are off by default.

          ## Evidence

          Authoritative GitHub Actions revalidation: run `31846345834`.

          Machine-readable reports:

          - `benchmarks/m5d-proxy-rank-diagnostics.json`;
          - `benchmarks/m5d-widening-calibration.json`;
          - `benchmarks/m5d-widening-holdout.json`;
          - `benchmarks/m5d-four-token-benchmark.json`.

          The engine measurement lock remains `3c36ee7f2eeb8634d32a23a20bd9dd4babbac397`.

          ## Next bounded step

          Outcome A permits the next frozen experiment: **target-probability `t=3` feasibility** using the selected Wide widening policy and aggressive M5C continuation fidelity. Production depth should remain at two until the target-probability path is characterized separately.
          '''
          m5d = '\n'.join(line[10:] if line.startswith('          ') else line for line in m5d.splitlines()).strip() + '\n'
          Path('M5D_PROGRESSIVE_ACTION_WIDENING.md').write_text(m5d, encoding='utf-8')

          perf = Path('PERFORMANCE.md')
          text = perf.read_text(encoding='utf-8')
          marker = '## M5D progressive action widening\n'
          before, sep, _ = text.partition(marker)
          if not sep:
              raise SystemExit('M5D performance section marker not found')
          section = '''## M5D progressive action widening

          M5D adds deterministic progressive widening to **distant fresh-menu operation evaluation** while leaving the root/current visible menu exact. Every future operation identity retains a value and remains in the exact uniform best-of-three menu operator; operations outside the deepening cap keep their one-spend shallow value.

          The frozen candidates were Wide `12→8→4`, Medium `8→5→3`, and Narrow `5→3→2`, with M5C aggressive outcome fidelity `4→2→1` fixed in the background. The widest passing policy rule selected **Wide**.

          Final frozen calibration and holdout results:

          | Gate | Result |
          |---|---:|
          | Calibration top-action agreement | **12/12** |
          | Calibration max regret | **0** |
          | Wide median runtime / oracle | **0.471×** |
          | Wide median runtime / M5C aggressive | **0.756×** |
          | Combined calibration + holdout agreement | **19/20 (95%)** |
          | Combined max regret | **383.53** |
          | Mean normalized regret | **0.050** |
          | Disagreements with oracle gap >1,000 | **0** |
          | Proxy deep winner within shallow top 3 | **24/24** |

          The sole 20-case disagreement is a permitted near-tie on `holdout-05`; there is no stop/menu bias or disagreement-family concentration. All three M5C interaction sentinels preserve the oracle winner.

          The first four-token run exposed an exact scoring hot spot rather than a widening-fidelity failure. Two semantics-preserving fixes—dense prefix-aligned terminal composition and a direct canonical-team title-boost lookup—reduced terminal scoring overhead while retaining compact-vs-descriptive scoring equivalence and alias behavior.

          The authoritative final `t=4` run completed all five required expected-score workloads below 60 seconds:

          | Workload | Wide `t=4` |
          |---|---:|
          | Default | **31.86 s** |
          | Quality-heavy | **36.87 s** |
          | Stat-heavy | **48.22 s** |
          | Trait-heavy | **29.35 s** |
          | Global-quality | **31.36 s** |

          **Decision: M5D Outcome A.** Four-token expected-score search is feasible under the frozen M5C-aggressive + M5D-Wide engineering policy. Production nevertheless remains capped at two modeled token spends, with both approximations disabled by default. The next bounded experiment is target-probability `t=3` feasibility; production depth should not change until that path is characterized.

          Raw evidence: `benchmarks/m5d-proxy-rank-diagnostics.json`, `benchmarks/m5d-widening-calibration.json`, `benchmarks/m5d-widening-holdout.json`, and `benchmarks/m5d-four-token-benchmark.json`. Full interpretation: `M5D_PROGRESSIVE_ACTION_WIDENING.md`.
          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()).strip() + '\n'
          perf.write_text(before + section, encoding='utf-8')

      - name: Remove temporary experiment scaffolding
        run: |
          rm -f .github/workflows/m5e-cpu-profile.yml
          rm -f .github/workflows/m5e-full-revalidation.yml
          rm -f .github/workflows/m5e-generate.yml
          rm -f .github/workflows/m5e-terminal-composition.yml
          rm -f benchmarks/m5e-full-run-request.txt
          rm -f benchmarks/m5e-run-request.txt
          rm -f benchmarks/m5e-package-run-request.txt

      - name: Verify packaged repository
        run: npm run test:ci

      - name: Commit packaged M5D Outcome A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "M5D: record Outcome A revalidation"
          git push origin HEAD:agent/m5e-terminal-composition
