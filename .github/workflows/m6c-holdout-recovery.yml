name: M6C Holdout Recovery

on:
  push:
    branches:
      - agent/m6c-expanded-t2-approximation
    paths:
      - '.github/m6c-holdout-recovery-request'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify frozen recovery inputs
        run: |
          node - <<'NODE'
          const s=require('./benchmarks/m6c-selection.json');
          const h=require('./benchmarks/m6c-expanded-holdout-fixtures.json');
          if(s.selectedCandidate!=='root-k2'||s.selectedOn!=='calibration_only'||s.outcome!=='B') throw Error('frozen candidate/outcome changed');
          if(h.layoutId!=='expanded_5'||h.horizon!==2) throw Error('holdout corpus changed');
          NODE
          git diff --exit-code 42a1a7ec7553e7d6df5f4d3c5576417fcdbbb35a -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
      - name: Rerun frozen holdout for artifact recovery only
        env:
          M6C_CASE_TIMEOUT_MS: 240000
        run: node scripts/benchmark-m6c.mjs --phase=holdout --candidate=root-k2
      - name: Upload recovery evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6c-expanded-t2-holdout-recovery
          path: |
            benchmarks/m6c-expanded-holdout-results.json
            benchmarks/m6c-selection.json
            benchmarks/m6c-expanded-holdout-fixtures.json
            benchmarks/m6c-expanded-candidates.json
          if-no-files-found: error
      - name: Commit complete holdout result
        if: success()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='benchmarks/m6c-expanded-holdout-results.json';
          const h=JSON.parse(fs.readFileSync(p,'utf8'));
          h.recoveryRun=true;
          h.recoveryPurpose='complete missing deliverable artifact after first run packaging failure; no retuning or candidate change';
          h.originalAuthoritativeWorkflowRunId=31912908836;
          fs.writeFileSync(p,JSON.stringify(h,null,2)+'\n');
          const sp='benchmarks/m6c-selection.json';
          const s=JSON.parse(fs.readFileSync(sp,'utf8'));
          s.recoveryRun=true;
          s.originalAuthoritativeWorkflowRunId=31912908836;
          fs.writeFileSync(sp,JSON.stringify(s,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/m6c-expanded-holdout-results.json benchmarks/m6c-selection.json
          git commit -m 'M6C: recover complete holdout artifact'
          git push origin HEAD:${GITHUB_REF_NAME}
