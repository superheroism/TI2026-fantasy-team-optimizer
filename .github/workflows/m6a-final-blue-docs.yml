name: M6A Final Corrected Blue Documentation

on:
  push:
    branches:
      - agent/m6a-versioned-board-layout

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6a-versioned-board-layout

      - name: Replace M6A benchmark documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          perf = Path('PERFORMANCE.md')
          s = perf.read_text()
          section = '''## M6A versioned board-layout baseline

M6A generalizes the engine from the legacy 9-emblem board to a versioned 15-emblem layout while preserving production behavior. Both layouts use exactly the same three stat colors — **Red, Green, and Blue** — and each color uses the unchanged `legacy_3` eligible-stat pool.

Five-slot quality redistribution is defined from authoritative project input: choose one uniformly random slot to decrease, then choose two distinct recipients uniformly from the six unordered pairs among the remaining four slots. The other two slots are unchanged. Tier-direction distributions and Tier-I/Tier-V floor/cap waste remain unchanged, and duplicate final states are aggregated. The same implementation reduces exactly to the legacy mechanic on a three-slot banner.

The authoritative corrected Node 22/Linux benchmark was regenerated after removing the erroneous fourth stat-color assumption. It completed all 12 matrix cases with no benchmark errors or timeouts.

| Workload | expanded / legacy optimizer runtime | Interpretation |
|---|---:|---|
| stat-heavy `t=1` | 0.14×* | Noisy isolated wall-time result; state counts increase substantially. |
| stat-heavy `t=2` | 2.86× | Correctly targeting all repeated Blue/Red/Green slots enlarges the frontier. |
| quality-heavy `t=2` | 5.48× | Largest measured relative expansion. |
| trait-heavy `t=2` | 3.26× | Repeated-color/all-matching operations enlarge continuation breadth. |
| global-quality `t=2` | 4.13× | Includes validated five-slot redistribution. |
| target-probability `t=2` | 3.09× | Highest absolute-cost workload in the corrected matrix. |

`*` Do not interpret the isolated `t=1` timing as a structural expanded-board speedup. The production-relevant `t=2` runs and state/frontier counters are the useful comparison.

The structural conclusion strengthens after the correction. Representative Core green-stat branching remains **5 → 21 reachable outcomes**, while the corrected expanded target-probability `t=2` run reaches **17,862 target scalar states**. The dominant cost is transition/frontier growth and downstream unique-state evaluation rather than simply encoding five slots.

The final validation rebuilt generated artifacts, ran the corrected benchmark, and passed the complete **199-test** suite. A targeted audit also verifies that M6A board/stat semantics contain no fourth stat color. Existing unrelated visual-theme uses of the word “purple” are intentionally unaffected because they are UI palette terminology, not emblem/stat semantics.

M6A closes **Outcome A**: one versioned engine supports `legacy_3` and `expanded_5`, all known expanded operation semantics are represented, and stat legality remains the original Red/Green/Blue pools. Production remains `legacy_3` / `t<=2`; the M5H holdout remains untouched; target `t=3` was not resumed and `t=4` was not begun.

The next package should profile expanded-board `t=2` frontier containment first while retaining exact target-search work reuse as the other major performance opportunity.'''
          s = re.sub(r'## M6A versioned board-layout baseline[\s\S]*\Z', section, s)
          perf.write_text(s)

          road = Path('ENGINEERING_ROADMAP.md')
          s = road.read_text()
          section = '''## M6A — Versioned board-layout expansion

M6A interrupted the post-M5 deep-search sequence because the client geometry is expanding from three to five emblem slots per role. The engine now treats board geometry as ruleset/version data rather than a search invariant. `legacy_3` preserves Core `R-G-R`, Mid `R-B-G`, and Support `B-G-B`; `expanded_5` uses Core `R-G-R-G-R`, Mid `R-B-G-R-G`, and Support `B-G-B-G-B`. Both layouts use only the existing Red, Green, and Blue stat colors and their unchanged legacy eligible-stat pools.

Legacy compact IDs retain their original numeric namespace. Expanded board IDs occupy a disjoint versioned namespace, and layout identity is included in transition, scoring, target-preparation, and mechanics caches. The descriptive `BoardState` boundary remains explicit; old unversioned board objects resolve to `legacy_3`. Production remains pinned to `legacy_3` with modeled horizon `<=2`.

Five-slot quality redistribution is defined and tested: one slot is selected uniformly to decrease, then two distinct recipients are selected uniformly from all unordered pairs among the remaining four slots. The other two slots are unchanged. Existing tier-direction distributions, Tier-I/Tier-V floor/cap waste, and final-state aggregation are preserved. For `legacy_3`, the same generalized definition reduces exactly to one decreased slot and the other two increased.

The corrected authoritative Node 22 matrix completed 12/12 cases and the complete 199-test suite passed. Relative to `legacy_3`, corrected `expanded_5` optimizer runtime at `t=2` was **2.86× stat-heavy, 5.48× quality-heavy, 3.26× trait-heavy, 4.13× global-quality, and 3.09× target-probability**. The expanded target case reached **17,862 target scalar states**. The isolated stat-heavy `t=1` wall-time ratio was 0.14× and is treated as runner noise rather than evidence of a structural speedup.

The dominant effect is frontier/branch growth: representative stat-heavy one-step reachable outcomes remain 5 → 21, while correctly recognizing the added Blue slots substantially increases the operations and future states reachable from Mid/Support. M6A therefore closes as **Outcome A** with exactly three stat colors and one authoritative implementation.

**Sequencing decision:** do not resume experimental target `t=3`, consume the untouched M5H holdout, or begin `t=4` yet. The corrected measurements make expanded-board `t=2` frontier containment the next problem to profile first; exact target-search reuse from M5H remains relevant, but the next package should be selected from the expanded frontier profile rather than assumed in advance.'''
          s = re.sub(r'## M6A — Versioned board-layout expansion[\s\S]*\Z', section, s)
          road.write_text(s)

          report = Path('M6A_VERSIONED_BOARD_LAYOUT.md')
          s = report.read_text()
          perf_section = '''## Performance measurement

Committed deterministic inputs:

- `benchmarks/m6a-layout-legacy-fixtures.json`
- `benchmarks/m6a-layout-expanded-fixtures.json`

Authoritative output:

- `benchmarks/m6a-layout-comparison.json`

The corrected comparison was generated on Node `v22.23.2`, Linux x64 after removing the erroneous fourth stat-color assumption. It completed all 12 cases with no benchmark error or timeout.

| Workload | Expanded / legacy |
|---|---:|
| Stat-heavy `t=1` | 0.14×* |
| Stat-heavy `t=2` | 2.86× |
| Quality-heavy `t=2` | 5.48× |
| Trait-heavy `t=2` | 3.26× |
| Global-quality `t=2` | 4.13× |
| Target-probability `t=2` | 3.09× |

`*` The isolated `t=1` wall-time ratio is noisy and should not be interpreted as a structural expanded-board speedup.

The corrected expanded target-probability run reaches **17,862 target scalar states**. Representative Core green-stat one-step branching remains **5 → 21 outcomes**. The stronger runtime expansion relative to the earlier erroneous-color run is expected: Blue-targeted operations now correctly recognize all added Blue slots rather than treating those physical positions as a separate color.

The final validation rebuilt generated artifacts, regenerated this benchmark, passed all **199 tests**, and passed a targeted audit that no fourth stat color remains in M6A board/stat semantics. Visual-theme uses of “purple” remain unrelated UI palette terminology and are not stat colors.
'''
          s = re.sub(r'## Performance measurement[\s\S]*?(?=## Production decision)', perf_section + '\n', s)
          s = re.sub(r'## Outcome[\s\S]*\Z', '''## Outcome

Final classification: **Outcome A**. Legacy compatibility passes; expanded geometry, codecs, legality, transitions, scoring, caches, and UI paths are layout-aware; both layouts use only Red, Green, and Blue with unchanged eligible-stat pools; five-slot quality redistribution is fully defined and tested; and the corrected Node 22 benchmark/test finalization completed successfully.

Production remains `legacy_3` / `t<=2`. The next package should be selected from the corrected expanded-board frontier profile. Do not resume target `t=3`, consume the M5H holdout, or begin target `t=4` in M6A.
''', s)
          report.write_text(s)
          PY

      - name: Commit corrected documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PERFORMANCE.md ENGINEERING_ROADMAP.md M6A_VERSIONED_BOARD_LAYOUT.md
          git commit -m "M6A: document corrected blue-layout evidence"
          git push origin HEAD:agent/m6a-versioned-board-layout
