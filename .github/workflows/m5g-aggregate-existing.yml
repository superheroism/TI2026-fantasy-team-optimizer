name: M5G Aggregate Existing Run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed authoritative M5G workflow run ID
        required: true
        default: '31890281254'
  push:
    branches: [agent/m5g-target-t3-robustness]
    paths: [.github/m5g-aggregate-request]

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: m5g-*
          path: m5g-results
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '31890281254' }}
      - name: Aggregate frozen gate from authoritative artifacts
        env:
          M5G_PREFLIGHT_PASSED: 'true'
        run: node scripts/aggregate-m5g-target.mjs m5g-results benchmarks/m5g-target-t3-robustness.json M5G_TARGET_T3_ROBUSTNESS.md
      - uses: actions/upload-artifact@v4
        with:
          name: m5g-aggregate-recovered
          path: |
            benchmarks/m5g-target-t3-robustness.json
            M5G_TARGET_T3_ROBUSTNESS.md
