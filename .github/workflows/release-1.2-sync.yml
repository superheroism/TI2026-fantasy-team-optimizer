name: Sync v1.2 release metadata

on:
  push:
    branches:
      - agent/release-1.2.0

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-1.2.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Sync v1.2.0 lockfile"
            git push origin HEAD:agent/release-1.2.0
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run test:ci
      - name: Run production-route benchmark
        run: node scripts/benchmark-m7b-v1.mjs
      - name: Record benchmark pass
        run: |
          if [ ! -f release_gate_tmp.txt ]; then
            printf 'v1.2.0 production-route benchmark passed on Node 22\n' > release_gate_tmp.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release_gate_tmp.txt
            git commit -m "Record v1.2.0 release gate"
            git push origin HEAD:agent/release-1.2.0
          fi
