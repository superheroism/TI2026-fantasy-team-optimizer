name: Refresh screenshot import generated artifacts

on:
  push:
    branches:
      - agent/screenshot-board-import

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/screenshot-board-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- build docs; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs
          git commit -m "Regenerate screenshot import artifacts"
          git push origin HEAD:agent/screenshot-board-import
