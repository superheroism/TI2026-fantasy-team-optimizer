name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fix strict optional diagnostic copy
        run: sed -i 's/components?:ScreenshotConfidenceComponents;/components?:ScreenshotConfidenceComponents|undefined;/' src/import/screenshotImport.ts

      - name: Build and validate
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run verify:generated
          node --test tests/*.test.mjs

      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/import/screenshotImport.ts build docs
          git commit -m "Regenerate screenshot import artifacts"
          git push origin HEAD:${{ github.head_ref }}
