name: Prepare v1.1.0 lockfile

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/release-1.1.0-finalize'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-1.1.0-finalize
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize lockfile version
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Validate release tree
        run: npm run test:ci

      - name: Restore permanent CI and commit lockfile
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize v1.1.0 lockfile metadata"
          git push origin HEAD:agent/release-1.1.0-finalize
