name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize fresh-action cache benchmark
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('benchmarks/m5b-fresh-action-cache.json'))
          def slim(x):
              c=x['cold']; w=x['warm']; d=c['engineDiagnostics']; v=d['valueFunction']
              return {
                'coldMs':c['runtimeMs'],'warmMs':w['runtimeMs'],'recommendation':c['recommendation'],'utility':c['utility'],
                'heapDelta':c['memory']['heapDelta'],'maxRssEnd':c['memory']['maxRssEnd'],
                'actionEntries':v['actionEntries'],'actionHits':v['actionCacheHits'],'actionMisses':v['actionCacheMisses'],
                'actionBypasses':v.get('actionCacheBypasses'),'terminalEntries':v['terminalEntries'],
                'targetedEntries':d['targetedActionEntries'],'transitionEntries':d['transitionDistributionEntries'],
              }
          print('M5B_ACTION_CACHE='+json.dumps({'pre':slim(r['pre']),'post':slim(r['post'])},separators=(',',':')))
          PY
