name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  main-event-defaults:
    if: github.head_ref == 'agent/release-1.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-1.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Main Event defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          state = Path('src/ui/state.ts')
          text = state.read_text()
          old_import = "import { DEFAULT_EXPECTED_SERIES_BY_LAYOUT, convertBoardLayout, createDefaultBoard, defaultBoard, defaultMenu, resolvedLayoutId } from '../data/defaultState.js';"
          new_import = "import { DEFAULT_EXPECTED_SERIES_BY_LAYOUT, convertBoardLayout, createDefaultBoard, defaultMenu, resolvedLayoutId } from '../data/defaultState.js';"
          if old_import not in text:
              raise SystemExit('state import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_board = '  board: BoardState = structuredClone(defaultBoard);'
          new_board = "  board: BoardState = createDefaultBoard('expanded_5');"
          if old_board not in text:
              raise SystemExit('state board anchor not found')
          text = text.replace(old_board, new_board, 1)
          if text.count('tokensRemaining = 10;') != 2:
              raise SystemExit('expected exactly two token default anchors')
          text = text.replace('tokensRemaining = 10;', 'tokensRemaining = 30;')
          state.write_text(text)

          expected = Path('tests/expected-series-override.test.mjs')
          expected.write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';

          import { ApplicationState } from '../docs/js/ui/state.js';

          const roles=['core','mid','support'];
          const series=state=>roles.map(role=>state.board[role].expectedSeries);

          test('Main Event startup defaults to five emblems, three expected series, and 30 roll tokens',()=>{
            const state=new ApplicationState();
            assert.equal(state.board.layoutId,'expanded_5');
            assert.deepEqual(roles.map(role=>state.board[role].emblems.length),[5,5,5]);
            assert.deepEqual(series(state),[3,3,3]);
            assert.equal(state.tokensRemaining,30);
          });

          test('manual Expected Series overrides survive later layout changes while untouched roles follow layout defaults',()=>{
            const state=new ApplicationState();
            state.setExpectedSeries('core',7);
            state.changeLayout('legacy_3');
            assert.deepEqual(series(state),[7,5,5]);
            state.setExpectedSeries('support',6);
            state.changeLayout('expanded_5');
            assert.deepEqual(series(state),[7,3,6]);
            state.changeLayout('legacy_3');
            assert.deepEqual(series(state),[7,5,6]);
          });

          test('reset clears Expected Series overrides and restores the active layout and token defaults',()=>{
            const state=new ApplicationState();
            state.setExpectedSeries('mid',9);
            assert.deepEqual(series(state),[3,9,3]);
            state.tokensRemaining=4;
            state.resetBoard();
            assert.deepEqual(series(state),[3,3,3]);
            assert.equal(state.tokensRemaining,30);
          });
          """.replace('          ', ''))

          versioned = Path('tests/versioned-layout.test.mjs')
          text = versioned.read_text()
          old = "  assert.equal(state.changeLayout('expanded_5'),true);"
          new = "  assert.equal(state.board.layoutId,'expanded_5');\n  assert.equal(state.changeLayout('expanded_5'),false);"
          if old not in text:
              raise SystemExit('versioned-layout startup anchor not found')
          versioned.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          text = readme.read_text()
          old = '**3 Emblems** is the backward-compatible default. Expected Series defaults to **5** for 3 Emblems and **3** for 5 Emblems.'
          new = '**5 Emblems** is the Main Event default. **3 Emblems** remains available for earlier boards. Expected Series defaults to **3** for 5 Emblems and **5** for 3 Emblems. New sessions start with **30 roll tokens**; edit the count to match your current client state.'
          if old not in text:
              raise SystemExit('README default-layout anchor not found')
          readme.write_text(text.replace(old, new, 1))

          notes = Path('RELEASE_NOTES_1.1.0.md')
          text = notes.read_text()
          old = '- **Expected Series defaults:** 3-emblem boards default to 5 series; 5-emblem boards default to 3. Manual overrides survive later layout switches.'
          new = '- **Main Event defaults:** new sessions start on the 5-emblem board with 30 roll tokens. Expected Series defaults to 3 for 5-emblem boards and 5 for 3-emblem boards. Manual overrides survive later layout switches.'
          if old not in text:
              raise SystemExit('release-note defaults anchor not found')
          notes.write_text(text.replace(old, new, 1))
          PY

      - name: Regenerate committed application artifacts
        run: npm run build

      - name: Verify final product tree
        run: npm run test:ci

      - name: Restore permanent CI and commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/state.ts tests/versioned-layout.test.mjs tests/expected-series-override.test.mjs README.md RELEASE_NOTES_1.1.0.md build docs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Use Main Event startup defaults"
          git push origin HEAD:agent/release-1.1.0
