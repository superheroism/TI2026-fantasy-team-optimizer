name: Regenerate Otsu stat fallback

on:
  push:
    branches:
      - agent/screenshot-stat-otsu-fallback

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v4
        with:
          ref: agent/screenshot-stat-otsu-fallback
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Otsu fallback
        run: node scripts/apply-stat-otsu-fallback.mjs

      - name: Build and validate
        run: |
          npm run build
          npm run test:ci

      - name: Commit source, tests, and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/import/emblemOcrRefinement.ts src/import/ocrImagePreprocess.ts tests/ocr-image-preprocess.test.mjs build docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Otsu fallback for low-confidence stats"
          git push origin HEAD:agent/screenshot-stat-otsu-fallback
