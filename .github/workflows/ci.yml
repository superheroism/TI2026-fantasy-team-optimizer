name: CI

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-event-defaults-group-stage-roster
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate application artifacts
        run: npm run build

      - name: Validate regenerated tree
        run: npm run test:ci

      - name: Commit generated artifacts and restore permanent CI
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs .github/workflows/ci.yml
          git commit -m "Regenerate model default artifacts"
          git push origin HEAD:agent/main-event-defaults-group-stage-roster
