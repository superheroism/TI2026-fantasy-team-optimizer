name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate application artifacts
        run: npm run build

      - name: Validate regenerated tree
        run: npm run test:ci

      - name: Upload regenerated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr63-generated
          path: |
            build
            docs
