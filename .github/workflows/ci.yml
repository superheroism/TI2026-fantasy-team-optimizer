name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize M5B benchmark
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('benchmarks/m5b-exact-optimizations.json'))
          def slim(x):
              if x.get('timeout'):
                  return {'case':x.get('case'),'horizon':x.get('horizon'),'timeout':True,'exitCode':x.get('exitCode')}
              c=x['cold']; w=x['warm']; d=c['engineDiagnostics']
              return {
                  'case':x['case'],'horizon':x['horizon'],
                  'coldMs':c['runtimeMs'],'warmMs':w['runtimeMs'],
                  'recommendation':c['recommendation'],'utility':c['utility'],'runnerUp':c['runnerUp'],
                  'heapDelta':c['memory']['heapDelta'],'maxRssEnd':c['memory']['maxRssEnd'],
                  'descriptiveBoards':d['descriptiveBoardMaterializations'],
                  'descriptiveBoardEntries':d['descriptiveBoardCacheEntries'],
                  'expectedBannerMaterializations':d.get('expectedBannerMaterializations'),
                  'expectedBannerEntries':d.get('expectedBannerCacheEntries'),
                  'targetedEntries':d['targetedActionEntries'],
                  'targetedBypasses':d.get('targetedActionCacheBypasses'),
                  'transitionEntries':d['transitionDistributionEntries'],
                  'transitionBypasses':d.get('transitionDistributionCacheBypasses'),
                  'terminalStates':d['valueFunction']['terminalEntries'],
                  'actionEntries':d['valueFunction']['actionEntries'],
                  'menuMs':d['menuOperator']['operatorMs'],
                  'rawRescoreMs':c['rawScenarioDiagnostics']['rescoreMs'],
              }
          print('M5B_SUMMARY='+json.dumps({'baseline':[slim(x) for x in r['baseline']],'optimized':[slim(x) for x in r['optimized']]},separators=(',',':')))
          PY
