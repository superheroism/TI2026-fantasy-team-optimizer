name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, verify generated output, and test
        run: npm run test:ci

      - name: Capture generated output for M5B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5b-generated
          path: |
            build/js/engine
            docs/js/engine
