name: M6F integration

on:
  push:
    branches: [agent/m6f-ui-layout-worker]
    paths: [.github/m6f-apply-request]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6f-ui-layout-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-m6f-integration.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: node --test
      - name: Commit source integration and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src site tests build docs
          git commit -m "M6F integrate board layout UI and optimizer worker"
          git push origin HEAD:agent/m6f-ui-layout-worker
