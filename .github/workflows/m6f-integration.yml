name: M6F integration

on:
  push:
    branches: [agent/m6f-ui-layout-worker]
    paths: [.github/m6f-apply-request]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6f-ui-layout-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-m6f-integration.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Run regression suite
        id: tests
        continue-on-error: true
        run: node --test > m6f-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6f-test-log
          path: m6f-test.log
      - name: Persist failed regression diagnostics
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w0 m6f-test.log)
          gh api --method PUT repos/${{ github.repository }}/contents/.github/m6f-test.log \
            -f message='M6F capture failed regression diagnostics' \
            -f content="$CONTENT" \
            -f branch='agent/m6f-ui-layout-worker'
          exit 1
      - name: Commit source integration and generated artifacts
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src site tests build docs
          git commit -m "M6F integrate board layout UI and optimizer worker"
          git pull --rebase origin agent/m6f-ui-layout-worker
          git push origin HEAD:agent/m6f-ui-layout-worker
