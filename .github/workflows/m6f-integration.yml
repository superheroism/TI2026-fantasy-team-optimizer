name: M6F integration

on:
  push:
    branches: [agent/m6f-ui-layout-worker]
    paths: [.github/m6f-apply-request]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6f-ui-layout-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-m6f-docs.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit M6F documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PERFORMANCE.md ENGINEERING_ROADMAP.md M6F_UI_LAYOUT_AND_WORKER_INTEGRATION.md
          git commit -m "M6F finalize browser evidence and documentation"
      - run: npm run test:ci
      - run: git pull --rebase origin agent/m6f-ui-layout-worker
      - run: git push origin HEAD:agent/m6f-ui-layout-worker
