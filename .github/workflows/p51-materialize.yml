name: P51 materialize

on:
  push:
    branches:
      - agent/p51-ocr-robustness

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/p51-ocr-robustness

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize P51 source changes
        shell: bash
        run: |
          mkdir -p engineering
          printf '%s' '' | base64 -d | gzip -d > engineering/.p51-materialize.py
          python3 engineering/.p51-materialize.py
          rm engineering/.p51-materialize.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build generated artifacts
        run: npm run build

      - name: Validate P51
        run: npm run test:ci

      - name: Commit materialized source and generated output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build docs tests
          git diff --cached --quiet && exit 0
          git commit -m 'Implement P51 bounded OCR execution and diagnostics'
          git push origin HEAD:agent/p51-ocr-robustness
