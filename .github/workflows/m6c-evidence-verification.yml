name: M6C Evidence Verification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/m6c-expanded-t2-approximation
    paths:
      - '.github/m6c-verify-request'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ci
      - name: Verify frozen Outcome B evidence without rerunning holdout
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./benchmarks/m6c-selection.json');
          const c=require('./benchmarks/m6c-expanded-calibration-results.json');
          const h=require('./benchmarks/m6c-expanded-holdout-results.json');
          if(s.selectedCandidate!=='root-k2'||s.selectedOn!=='calibration_only'||!s.holdoutConsumed||s.holdoutPassed!==false||s.outcome!=='B') throw Error('selection/outcome evidence mismatch');
          if(c.selection!=='root-k2'||c.candidates.find(x=>x.policy.id==='root-k2')?.summary.rootActionAgreement!==1) throw Error('calibration evidence mismatch');
          if(h.selectedCandidate!=='root-k2'||h.passed!==false||h.outcome!=='B'||h.summary.rootActionAgreement!==0.75) throw Error('holdout evidence mismatch');
          if(h.evidenceSource.workflowRunId!==31912908836||h.evidenceSource.oneShot!==true) throw Error('authoritative run provenance mismatch');
          NODE
          git diff --exit-code 42a1a7ec7553e7d6df5f4d3c5576417fcdbbb35a -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
          ! grep -R -E 'modeledHorizonOverride[[:space:]]*:[[:space:]]*[34]' scripts/m6c-*.mjs scripts/benchmark-m6c*.mjs
          ! grep -R -i 'm5h-target-holdout' scripts/m6c-*.mjs scripts/benchmark-m6c*.mjs
      - name: Finalize documentation from frozen evidence
        run: node scripts/finalize-m6c.mjs
      - name: Verify final documentation and production isolation
        run: |
          grep -q 'Outcome B' M6C_EXPANDED_T2_APPROXIMATION.md
          grep -q 'root-k2' M6C_EXPANDED_T2_APPROXIMATION.md
          grep -q '75.0%' M6C_EXPANDED_T2_APPROXIMATION.md
          grep -q 'M6C expanded t=2 approximation calibration' PERFORMANCE.md
          grep -q 'M6C — Expanded t=2 approximation calibration' ENGINEERING_ROADMAP.md
          git diff --exit-code 42a1a7ec7553e7d6df5f4d3c5576417fcdbbb35a -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
      - name: Upload authoritative M6C evidence
        uses: actions/upload-artifact@v4
        with:
          name: m6c-expanded-t2-outcome-b-evidence
          path: |
            benchmarks/m6c-expanded-calibration-fixtures.json
            benchmarks/m6c-expanded-holdout-fixtures.json
            benchmarks/m6c-expanded-candidates.json
            benchmarks/m6c-expanded-calibration-results.json
            benchmarks/m6c-expanded-holdout-results.json
            benchmarks/m6c-selection.json
            M6C_EXPANDED_T2_APPROXIMATION.md
            PERFORMANCE.md
            ENGINEERING_ROADMAP.md
      - name: Commit finalized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M6C_EXPANDED_T2_APPROXIMATION.md PERFORMANCE.md ENGINEERING_ROADMAP.md
          if git diff --cached --quiet; then echo 'Documentation already finalized'; else git commit -m 'M6C: finalize Outcome B evidence'; git push origin HEAD:${GITHUB_REF_NAME}; fi
