name: p52-board5-experiment

on:
  push:
    branches:
      - agent/p52-final-ocr-certification

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52-final-ocr-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply general long-token stat evidence experiment
        run: |
          python - <<'PY'
          from pathlib import Path

          policy=Path('src/import/ocrRetryPolicy.ts')
          s=policy.read_text()
          s=s.replace(
            "export const FUZZY_STAT_CONFIDENCE_GATE=.68;\n",
            "export const FUZZY_STAT_CONFIDENCE_GATE=.68;\nexport const LONG_TOKEN_STAT_LENGTH_GATE=6;\nexport const LONG_TOKEN_STAT_MARGIN_GATE=.12;\nexport const LONG_TOKEN_STAT_EXISTING_CONFIDENCE_CEILING=.70;\n"
          )
          s=s.replace(
            " * Accept stat evidence in three cases: exact legal text, the historical strong\n * fuzzy gate, or a lower-confidence fuzzy read that wins decisively over every\n * other stat in the same legal color pool. The measured confidence is retained;\n",
            " * Accept stat evidence from exact/high-confidence text, the historical strong\n * fuzzy gate, or a bounded long-token recovery when a weak existing field has\n * strong absolute evidence and a meaningful same-color lead. The measured confidence is retained;\n"
          )
          s=s.replace(
            "export function acceptsStatEvidence(matchScore:number,confidence:number,runnerUpMargin=0):boolean{\n",
            "export function acceptsStatEvidence(matchScore:number,confidence:number,runnerUpMargin=0,candidateLength=0,existingConfidence=1):boolean{\n"
          )
          s=s.replace(
            "  if(matchScore>=FUZZY_STAT_MATCH_GATE&&runnerUpMargin>=FUZZY_STAT_MARGIN_GATE&&confidence>=FUZZY_STAT_CONFIDENCE_GATE)return true;\n  return matchScore>=STAT_MATCH_GATE&&confidence>=STRUCTURED_CONFIDENCE_GATE;\n",
            "  if(matchScore>=FUZZY_STAT_MATCH_GATE&&runnerUpMargin>=FUZZY_STAT_MARGIN_GATE&&confidence>=FUZZY_STAT_CONFIDENCE_GATE)return true;\n  if(candidateLength>=LONG_TOKEN_STAT_LENGTH_GATE&&existingConfidence<LONG_TOKEN_STAT_EXISTING_CONFIDENCE_CEILING&&matchScore>=FUZZY_STAT_MATCH_GATE&&runnerUpMargin>=LONG_TOKEN_STAT_MARGIN_GATE)return true;\n  return matchScore>=STAT_MATCH_GATE&&confidence>=STRUCTURED_CONFIDENCE_GATE;\n"
          )
          policy.write_text(s)

          ref=Path('src/import/emblemOcrRefinement.ts')
          s=ref.read_text()
          old="acceptsStatEvidence(sm.score,sc,sm.score-sm.runnerUpScore)"
          new="acceptsStatEvidence(sm.score,sc,sm.score-sm.runnerUpScore,sm.value.replace(/[^A-Za-z0-9]/g,'').length,confidenceFor(raw,sp))"
          assert old in s
          s=s.replace(old,new)
          old="acceptsStatEvidence(fallbackMatch.score,fallbackConfidence,fallbackMatch.score-fallbackMatch.runnerUpScore)"
          new="acceptsStatEvidence(fallbackMatch.score,fallbackConfidence,fallbackMatch.score-fallbackMatch.runnerUpScore,fallbackMatch.value.replace(/[^A-Za-z0-9]/g,'').length,confidenceFor(raw,sp))"
          assert old in s
          s=s.replace(old,new)
          ref.write_text(s)

          test=Path('tests/p52-exact-stat-evidence.test.mjs')
          s=test.read_text()
          s=s.replace(
            "  FUZZY_STAT_MATCH_GATE,\n",
            "  FUZZY_STAT_MATCH_GATE,\n  LONG_TOKEN_STAT_EXISTING_CONFIDENCE_CEILING,\n  LONG_TOKEN_STAT_LENGTH_GATE,\n  LONG_TOKEN_STAT_MARGIN_GATE,\n"
          )
          s += "\ntest('long legal stat tokens can use a narrower same-color margin only while the existing field is weak',()=>{\n  assert.equal(LONG_TOKEN_STAT_LENGTH_GATE,6);\n  assert.equal(LONG_TOKEN_STAT_MARGIN_GATE,.12);\n  assert.equal(LONG_TOKEN_STAT_EXISTING_CONFIDENCE_CEILING,.70);\n  assert.equal(acceptsStatEvidence(.714,.50,.143,7,0),true);\n  assert.equal(acceptsStatEvidence(.714,.50,.143,5,0),false);\n  assert.equal(acceptsStatEvidence(.714,.50,.119,7,0),false);\n  assert.equal(acceptsStatEvidence(.699,.50,.143,7,0),false);\n  assert.equal(acceptsStatEvidence(.714,.50,.143,7,.70),false);\n});\n"
          test.write_text(s)

          for name in ['tests/p52-stat-psm6.test.mjs','tests/retry-consolidation-contract.test.mjs']:
            p=Path(name)
            s=p.read_text()
            s=s.replace(
              'acceptsStatEvidence(sm.score,sc,sm.score-sm.runnerUpScore)',
              "acceptsStatEvidence(sm.score,sc,sm.score-sm.runnerUpScore,sm.value.replace(/[^A-Za-z0-9]/g,'').length,confidenceFor(raw,sp))"
            )
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Remove experiment workflow and commit generated mirrors
        run: |
          rm .github/workflows/p52-board5-experiment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P52: add bounded long-token stat recovery"
          git push origin HEAD:agent/p52-final-ocr-certification
