name: M6A authoritative layout benchmark

on:
  push:
    branches:
      - agent/m6a-versioned-board-layout
    paths:
      - '.github/workflows/m6a-benchmark.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6a-versioned-board-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node scripts/benchmark-m6a-layout.mjs --json=benchmarks/m6a-layout-comparison.json
        env:
          M6A_CASE_TIMEOUT_MS: '150000'
      - name: Commit benchmark artifact
        run: |
          # Rerun after making compact terminal scoring layout-aware.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/m6a-layout-comparison.json build docs
          git diff --cached --quiet && exit 0
          git commit -m "benchmarks: record M6A Node 22 layout comparison"
          git push origin HEAD:agent/m6a-versioned-board-layout
