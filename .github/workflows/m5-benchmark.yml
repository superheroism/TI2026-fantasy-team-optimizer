name: M5 four-token benchmark

on:
  push:
    branches: [agent/m5-four-token-experiment]

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/m5-four-token-experiment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run M5A benchmark
        env:
          M5_CASE_TIMEOUT_MS: 60000
        run: npm run benchmark:m5 -- --json=benchmarks/m5-four-token-experiment.json

      - name: Commit benchmark report
        if: always()
        run: |
          if [ -f benchmarks/m5-four-token-experiment.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add benchmarks/m5-four-token-experiment.json
            if ! git diff --cached --quiet; then
              git commit -m "M5A: record four-token benchmark"
              git push
            fi
          fi
