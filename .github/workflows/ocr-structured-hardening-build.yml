name: OCR structured hardening build
on:
  push:
    branches: [agent/ocr-structured-field-hardening]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Finalize source patch
        run: python scripts/finalize-ocr-structured-hardening.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/ocr-domain-match.test.mjs tests/screenshot-import.test.mjs
      - name: Commit generated artifacts and remove temporary harness
        run: |
          rm .github/workflows/ocr-structured-hardening-build.yml scripts/finalize-ocr-structured-hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/import/emblemOcrRefinement.ts build docs SCREENSHOT_OCR_EXPANDED_FIXTURE_2026-08-16.md .github/workflows scripts
          git commit -m 'Recover structured OCR fields from native card and footer regions'
          git push
