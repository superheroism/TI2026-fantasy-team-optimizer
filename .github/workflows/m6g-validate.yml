name: M6G validate
on:
  push:
    branches: [agent/m6g-ui-application-decomposition]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full CI-equivalent suite
        shell: bash
        run: |
          set +e
          npm run test:ci 2>&1 | tee m6g-test-ci.txt
          code=${PIPESTATUS[0]}
          echo "$code" > m6g-test-ci-exit.txt
          exit 0
      - name: Install browser-smoke harness dependency
        run: npm install --no-save --package-lock=false puppeteer-core
      - name: Browser smoke
        shell: bash
        run: |
          set +e
          node scripts/smoke-m6g-browser.mjs 2>&1 | tee m6g-browser-smoke.txt
          code=${PIPESTATUS[0]}
          echo "$code" > m6g-browser-smoke-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: m6g-validation
          path: |
            m6g-test-ci.txt
            m6g-test-ci-exit.txt
            m6g-browser-smoke.txt
            m6g-browser-smoke-exit.txt
