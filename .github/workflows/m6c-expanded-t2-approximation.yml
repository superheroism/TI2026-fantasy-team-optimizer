name: M6C Expanded t2 Approximation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/m6c-expanded-t2-approximation
    paths:
      - '.github/m6c-run-request'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Preflight tests
        run: npm run test:ci
      - name: Verify M6C production isolation before benchmark
        run: |
          git diff --exit-code 42a1a7ec7553e7d6df5f4d3c5576417fcdbbb35a -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
          node -e "for(const p of ['benchmarks/m6c-expanded-calibration-fixtures.json','benchmarks/m6c-expanded-holdout-fixtures.json']){const x=require('./'+p);if(x.layoutId!=='expanded_5'||x.horizon!==2)throw Error(p)}"
      - name: Run frozen calibration and exact oracles
        env:
          M6C_CASE_TIMEOUT_MS: 240000
        run: node scripts/benchmark-m6c.mjs --phase=calibration
      - name: Freeze calibration selection before holdout
        id: selection
        run: |
          CANDIDATE=$(node -p "require('./benchmarks/m6c-selection.json').selectedCandidate || ''")
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          cat benchmarks/m6c-selection.json
      - name: Run one-shot holdout only for frozen qualifying candidate
        if: steps.selection.outputs.candidate != ''
        env:
          M6C_CASE_TIMEOUT_MS: 240000
        run: node scripts/benchmark-m6c.mjs --phase=holdout --candidate=${{ steps.selection.outputs.candidate }}
      - name: Finalize M6C evidence and docs
        run: node scripts/finalize-m6c.mjs
      - name: Verify isolation after benchmark
        run: |
          git diff --exit-code 42a1a7ec7553e7d6df5f4d3c5576417fcdbbb35a -- src data benchmarks/m5h-target-holdout-fixtures.json benchmarks/m5h-target-holdout-gate.json
          grep -q 'Production is unchanged\|Production remains' M6C_EXPANDED_T2_APPROXIMATION.md
      - name: Upload authoritative M6C evidence
        uses: actions/upload-artifact@v4
        with:
          name: m6c-expanded-t2-approximation
          path: |
            benchmarks/m6c-expanded-calibration-fixtures.json
            benchmarks/m6c-expanded-holdout-fixtures.json
            benchmarks/m6c-expanded-candidates.json
            benchmarks/m6c-expanded-calibration-results.json
            benchmarks/m6c-selection.json
            benchmarks/m6c-expanded-holdout-results.json
            M6C_EXPANDED_T2_APPROXIMATION.md
          if-no-files-found: warn
      - name: Commit authoritative results and documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/m6c-expanded-calibration-results.json benchmarks/m6c-selection.json M6C_EXPANDED_T2_APPROXIMATION.md PERFORMANCE.md ENGINEERING_ROADMAP.md
          if [ -f benchmarks/m6c-expanded-holdout-results.json ]; then git add benchmarks/m6c-expanded-holdout-results.json; fi
          if git diff --cached --quiet; then echo 'No result changes'; else git commit -m 'M6C: record authoritative calibration outcome'; git push origin HEAD:${GITHUB_REF_NAME}; fi
