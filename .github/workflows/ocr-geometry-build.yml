name: OCR geometry branch build

on:
  push:
    branches:
      - agent/ocr-geometry-hardening

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ocr-geometry-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs
          git rm .github/workflows/ocr-geometry-build.yml
          git commit -m "Regenerate OCR geometry artifacts"
          git push origin HEAD:agent/ocr-geometry-hardening
