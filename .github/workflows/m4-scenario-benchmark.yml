name: M4 Scenario Prerequisite

on:
  push:
    branches:
      - agent/m4-dp-foundation

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build fresh generated output
        run: npm run build

      - name: Benchmark scenario reuse
        run: node scripts/benchmark-scenario-reuse.mjs --json=m4-scenario-prerequisite.json

      - name: Print report
        if: always()
        run: cat m4-scenario-prerequisite.json || true
