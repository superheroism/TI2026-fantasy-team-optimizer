name: OCR final sync
on:
  push:
    branches: [agent/ocr-final-fields-review-ui]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ocr-final-fields-review-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/ocr-domain-match.test.mjs tests/screenshot-import.test.mjs
      - name: Commit synchronized generated artifacts and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/ocr-final-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/screenshot-import.css docs/screenshot-import.css build docs .github/workflows/ocr-final-sync.yml
          git commit -m "Synchronize final screenshot OCR and review styling"
          git push origin HEAD:agent/ocr-final-fields-review-ui
