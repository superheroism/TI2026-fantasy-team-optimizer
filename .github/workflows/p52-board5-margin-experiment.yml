name: p52-board5-margin-experiment

on:
  push:
    branches:
      - agent/p52-final-ocr-certification

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p52-final-ocr-certification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply 0.10 long-token margin experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['src/import/ocrRetryPolicy.ts','tests/p52-exact-stat-evidence.test.mjs']:
            p=Path(name)
            s=p.read_text()
            if name.startswith('src/'):
              assert 'LONG_TOKEN_STAT_MARGIN_GATE=.12' in s
              s=s.replace('LONG_TOKEN_STAT_MARGIN_GATE=.12','LONG_TOKEN_STAT_MARGIN_GATE=.10')
            else:
              assert 'LONG_TOKEN_STAT_MARGIN_GATE,.12' in s
              s=s.replace('LONG_TOKEN_STAT_MARGIN_GATE,.12','LONG_TOKEN_STAT_MARGIN_GATE,.10')
              assert 'acceptsStatEvidence(.714,.50,.119,7,0),false' in s
              s=s.replace('acceptsStatEvidence(.714,.50,.119,7,0),false','acceptsStatEvidence(.714,.50,.099,7,0),false')
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Run focused OCR policy and contract tests
        run: node --test tests/p52-exact-stat-evidence.test.mjs tests/p52-stat-psm6.test.mjs tests/retry-consolidation-contract.test.mjs tests/ocr-image-preprocess.test.mjs tests/stat-row-retry-ui.test.mjs
      - name: Remove experiment debris and commit generated mirrors
        run: |
          rm .github/workflows/p52-board5-margin-experiment.yml
          rm -f .p52-board5-margin-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "P52: tune bounded long-token stat margin"
          git push origin HEAD:agent/p52-final-ocr-certification
