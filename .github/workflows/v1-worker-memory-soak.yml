name: v1 worker memory soak

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v1-public-engineering-docs
    paths:
      - scripts/benchmark-v1-worker-memory.mjs
      - .github/workflows/v1-worker-memory-soak.yml

permissions:
  contents: write

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-public-engineering-docs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned browser harness dependency
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Run dedicated-worker memory soak
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SOAK_REQUESTS: '24'
        run: node scripts/benchmark-v1-worker-memory.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v1-worker-memory-soak
          path: benchmarks/v1-worker-memory-soak.json
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/v1-worker-memory-soak.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "record worker memory soak evidence"
          git push
