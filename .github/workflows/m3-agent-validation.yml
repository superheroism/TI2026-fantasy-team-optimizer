name: M3 Agent Validation

on:
  push:
    branches:
      - agent/m3-compact-transitions

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'M3 validation artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out M3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/m3-compact-transitions
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install branch dependencies
        run: npm install --no-audit --no-fund

      - name: Benchmark main baseline on the same runner
        run: |
          git worktree add /tmp/m3-main origin/main
          cd /tmp/m3-main
          npm install --no-audit --no-fund
          npm run benchmark -- --json=/tmp/m3-precompact-baseline.json

      - name: Build branch and run exhaustive tests
        run: |
          npm run build
          npm run typecheck
          node --test tests/*.test.mjs

      - name: Benchmark compact transition branch
        run: npm run benchmark -- --json=/tmp/m3-postcompact-benchmark.json

      - name: Commit generated artifacts and benchmark reports
        run: |
          cp /tmp/m3-precompact-baseline.json benchmarks/m3-precompact-baseline.json
          cp /tmp/m3-postcompact-benchmark.json benchmarks/m3-postcompact-benchmark.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs benchmarks/m3-precompact-baseline.json benchmarks/m3-postcompact-benchmark.json
          if ! git diff --cached --quiet; then
            git commit -m "M3 validation artifacts"
            git push origin HEAD:agent/m3-compact-transitions
          fi
