name: publish v1.0.0

on:
  push:
    branches:
      - agent/v1-release
    paths:
      - .github/workflows/v1-publish-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: 54d265db6eea7ef4b64fecaac3544efdeaaaf383
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release identity
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          test "$(node -p "require('./package-lock.json').version")" = "1.0.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Final main release gate
        run: npm run test:ci
      - name: Create tag and GitHub release
        run: |
          if git ls-remote --tags origin refs/tags/v1.0.0 | grep -q .; then
            echo "v1.0.0 tag already exists; refusing to overwrite"
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.0.0 "$RELEASE_SHA" -m "v1.0.0"
          git push origin v1.0.0

          cat > /tmp/release-notes.md <<'EOF'
# Dota 2 Fantasy Optimizer v1.0.0

First stable release of the TI 2026 Fantasy Optimizer.

## Production contract

- Supports both 3-emblem (`legacy_3`) and 5-emblem (`expanded_5`) boards.
- Supports expected final score and target-probability objectives.
- Production lookahead is capped at two modeled token spends.
- Three-emblem search uses the full frozen production-reference search through the supported horizon.
- Five-emblem t=2 uses the frozen, holdout-validated adaptive reference policy with full reference fallback for unresolved ambiguity.

## Engineering and reliability

- Canonical TypeScript source with reproducible generated deployment artifacts.
- Compact canonical engine state, transition caching, reusable stochastic scenarios, and finite-horizon value-function search.
- Web Worker execution keeps optimization off the main UI thread and suppresses stale results.
- Worker lifecycle is bounded to prevent long-session cache accumulation; direct worker-memory soak evidence is recorded in the repository.
- Production model/title data fail clearly on incompatible schemas.
- Node 22 CI covers typecheck, ESLint, generated-output verification, and the full regression suite.

## Documentation

- `README.md` defines the v1.0 product contract and modeling assumptions.
- `ENGINEERING.md` explains the engineering progression, alternatives considered, evidence, and remaining limitations.
- Original milestone reports remain available under `engineering/history/`.
- Released under the MIT License.

## Known boundary

Search beyond two modeled token spends remains post-v1 research. Pre-v1 experiments found that deeper search is primarily limited by growth in newly reached decision-relevant states rather than an obvious missing cache.
EOF

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "v1.0.0 — Dota 2 Fantasy Optimizer 2026" \
            --notes-file /tmp/release-notes.md
