name: Refresh UI follow-up artifacts

on:
  push:
    branches:
      - agent/ui-alignment-followup

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-alignment-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update intentional UI copy contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ui-contract.test.mjs')
          s=p.read_text()
          old='assert.match(boardView,/AUTO ASSUMPTION:/);'
          new='assert.match(boardView,/most likely:/);'
          if old not in s and new not in s:
              raise SystemExit('Expected UI copy contract not found')
          p.write_text(s.replace(old,new))
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit generated output and contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui-contract.test.mjs build docs
          if git diff --cached --quiet; then
            echo "Generated output already current."
          else
            git commit -m "Regenerate UI follow-up artifacts"
            git push origin HEAD:agent/ui-alignment-followup
          fi
