name: M6F finalize

on:
  push:
    branches: [agent/m6f-ui-layout-worker]
    paths: [.github/m6f-finalize-request]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6f-ui-layout-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-m6f-integration.mjs
      - run: node scripts/fix-m6f-test-generator.mjs
      - run: node scripts/finalize-m6f-docs.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit integrated M6F source, docs, tests, and generated deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src site tests build docs README.md PERFORMANCE.md ENGINEERING_ROADMAP.md M6F_UI_LAYOUT_AND_WORKER_INTEGRATION.md benchmarks/m6f-browser-performance.json
          git commit -m "M6F integrate board layout UI and optimizer worker"
      - run: npm run test:ci
      - run: git push origin HEAD:agent/m6f-ui-layout-worker
