name: M6F browser benchmark

on:
  push:
    branches: [agent/m6f-ui-layout-worker]
    paths: [.github/m6f-benchmark-request]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6f-ui-layout-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-m6f-integration.mjs
      - run: node scripts/fix-m6f-test-generator.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Run real-browser worker characterization
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/benchmark-m6f-browser.mjs
      - name: Persist browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w0 benchmarks/m6f-browser-performance.json)
          gh api --method PUT repos/${{ github.repository }}/contents/benchmarks/m6f-browser-performance.json \
            -f message='M6F record browser worker performance' \
            -f content="$CONTENT" \
            -f branch='agent/m6f-ui-layout-worker'
