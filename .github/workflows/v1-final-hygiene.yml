name: v1 final hygiene

on:
  push:
    branches: [agent/v1-public-engineering-docs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-public-engineering-docs
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Add lightweight lint and formatting tooling
        run: |
          npm install --save-dev eslint@^9 typescript-eslint@^8 prettier@^3 --no-audit --no-fund
          cat > eslint.config.js <<'EOF'
          import tseslint from 'typescript-eslint';

          export default [
            {
              ignores: ['build/**', 'docs/**', 'engineering/history/**', 'node_modules/**'],
            },
            {
              files: ['src/**/*.ts'],
              languageOptions: { parser: tseslint.parser },
              rules: {
                'no-constant-binary-expression': 'error',
                'no-dupe-else-if': 'error',
                'no-duplicate-case': 'error',
                'no-fallthrough': 'error',
                'no-self-assign': 'error',
                'no-unreachable': 'error',
                'no-useless-catch': 'error',
              },
            },
            {
              files: ['scripts/**/*.mjs', 'tests/**/*.mjs'],
              rules: {
                'no-constant-binary-expression': 'error',
                'no-dupe-else-if': 'error',
                'no-duplicate-case': 'error',
                'no-fallthrough': 'error',
                'no-self-assign': 'error',
                'no-unreachable': 'error',
                'no-useless-catch': 'error',
              },
            },
          ];
          EOF
          cat > .prettierrc.json <<'EOF'
          {
            "printWidth": 100,
            "singleQuote": true,
            "trailingComma": "all"
          }
          EOF
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.lint = 'eslint src scripts tests';
          pkg.scripts['format:check'] = 'prettier --check src scripts tests *.md';
          pkg.scripts.format = 'prettier --write src scripts tests *.md';
          pkg.scripts['test:ci'] = 'npm run typecheck && npm run lint && npm run verify:generated && node --test tests/*.test.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          EOF
          npm run lint

      - name: Archive milestone engineering records
        run: |
          mkdir -p engineering/history
          for f in M*.md; do
            [ -e "$f" ] || continue
            git mv "$f" "engineering/history/$f"
          done
          cat > engineering/history/README.md <<'EOF'
          # Engineering history

          These files are the original milestone reports produced while the optimizer architecture was being developed and measured. They are retained as the detailed experimental record, including negative results and benchmark evidence.

          For the concise public narrative, start with [`../../ENGINEERING.md`](../../ENGINEERING.md). For the current product contract, start with [`../../README.md`](../../README.md).

          Historical milestone terminology is preserved as written. In particular, older reports may use **exact** where current public documentation uses the more precise **full production-reference search**. See `ENGINEERING.md` for that distinction.
          EOF

          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const archived = fs.readdirSync('engineering/history').filter(f => /^M.*\.md$/.test(f));
          for (const file of ['README.md', 'ENGINEERING.md', 'ENGINEERING_ROADMAP.md', 'PERFORMANCE.md', 'PRODUCT_DECISIONS.md', 'BUILD_AND_SOURCE_POLICY.md', 'CLIENT_RULES_2026.md']) {
            if (!fs.existsSync(file)) continue;
            let text = fs.readFileSync(file, 'utf8');
            for (const name of archived) {
              text = text.replaceAll('`' + name + '`', '`engineering/history/' + name + '`');
              text = text.replaceAll('(' + name + ')', '(engineering/history/' + name + ')');
            }
            fs.writeFileSync(file, text);
          }
          EOF

      - name: Final public-document consistency note
        run: |
          cat >> engineering/history/README.md <<'EOF'

          ## Reading order

          The milestone sequence runs from M2 instrumentation/search-kernel work through M7B v1.0 readiness. `ENGINEERING_ROADMAP.md` remains at repository root because it is the architecture chronology/authority rather than a single milestone report.
          EOF

      - name: Validate final branch
        run: |
          npm run test:ci
          npm run build
          npm run verify:generated

      - name: Commit final hygiene and remove this temporary workflow
        run: |
          rm .github/workflows/v1-final-hygiene.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "finish v1 repository hygiene"
          git push origin HEAD:agent/v1-public-engineering-docs
