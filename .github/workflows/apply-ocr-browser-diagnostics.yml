name: Apply browser OCR diagnostics
on:
  push:
    branches: [agent/ocr-browser-diagnostics]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[ocr-diagnostics]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ocr-browser-diagnostics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Add diagnostic path
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          s=s.replace("interface Worker { recognize(image:HTMLCanvasElement,options?:Record<string,unknown>,output?:Record<string,boolean>):Promise<{data:{tsv?:string}}>; setParameters(params:Record<string,unknown>):Promise<unknown>; }",
                      "interface Worker { recognize(image:HTMLCanvasElement|File,options?:Record<string,unknown>,output?:Record<string,boolean>):Promise<{data:{text?:string;tsv?:string}}>; setParameters(params:Record<string,unknown>):Promise<unknown>; }")
          marker="export async function warmLocalScreenshotOcr():Promise<void>{await getWorker();}"
          diag="""export interface BrowserOcrDiagnostic { sourceWidth:number;sourceHeight:number;fileType:string;fileBytes:number;elapsedMs:number;textLength:number;tsvLength:number;tsvLines:number;parsedWordCount:number;sampleText:string;sampleWords:string[]; }\nexport async function diagnoseLocalScreenshotOcr(file:File):Promise<BrowserOcrDiagnostic>{\n const img=await decode(file),w=await getWorker(),started=performance.now();\n const r=await w.recognize(file,{}, {tsv:true});\n const rawText=r.data.text??'',rawTsv=r.data.tsv??'',words=parse(rawTsv);\n return {sourceWidth:img.naturalWidth,sourceHeight:img.naturalHeight,fileType:file.type,fileBytes:file.size,elapsedMs:performance.now()-started,textLength:rawText.length,tsvLength:rawTsv.length,tsvLines:rawTsv?rawTsv.split(/\\r?\\n/).length:0,parsedWordCount:words.length,sampleText:rawText.replace(/\\s+/g,' ').trim().slice(0,500),sampleWords:words.slice(0,30).map(x=>x.text)};\n}\n"""+marker
          if marker not in s: raise SystemExit('warm marker not found')
          s=s.replace(marker,diag)
          p.write_text(s)

          p=Path('src/ui/screenshotImport.ts')
          s=p.read_text()
          s=s.replace("import { warmLocalScreenshotOcr } from '../import/localScreenshotOcr.js';",
                      "import { diagnoseLocalScreenshotOcr, warmLocalScreenshotOcr } from '../import/localScreenshotOcr.js';")
          insert="""\nfunction removeDiagnostic():void{document.querySelector('#screenshot-ocr-diagnostic')?.remove();}\nfunction showDiagnostic(value:unknown):void{removeDiagnostic();const host=$('#screenshot-import-status').parentElement;if(!host)return;const details=document.createElement('details');details.id='screenshot-ocr-diagnostic';details.open=true;const summary=document.createElement('summary');summary.textContent='OCR diagnostic';const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.style.wordBreak='break-word';pre.textContent=JSON.stringify(value,null,2);const copy=document.createElement('button');copy.type='button';copy.textContent='Copy diagnostic';copy.addEventListener('click',()=>void navigator.clipboard?.writeText(pre.textContent??''));details.append(summary,copy,pre);host.appendChild(details);}\n"""
          marker="function reviewPaths(result:ValidatedScreenshotImport):string[]{return result.lowConfidenceFields.map(field=>field.path);}"
          if marker not in s: raise SystemExit('review marker not found')
          s=s.replace(marker,marker+insert)
          old="button.disabled=true;button.textContent='Reading Screenshot…';setStatus('Local OCR: locating board and reading visible fields…','working');const started=performance.now();try{const raw=await requestScreenshotImport(file,data);applyImport(validateScreenshotImport(raw,data,state.board,state.menu),performance.now()-started);}catch(error){clearAllReviewHighlights();setStatus(error instanceof Error?error.message:String(error),'error');}finally{button.disabled=false;button.textContent='Import Screenshot';}"
          new="button.disabled=true;button.textContent='Reading Screenshot…';removeDiagnostic();setStatus('Local OCR: locating board and reading visible fields…','working');const started=performance.now();try{const raw=await requestScreenshotImport(file,data);const validated=validateScreenshotImport(raw,data,state.board,state.menu);applyImport(validated,performance.now()-started);if(validated.requiresReview){try{showDiagnostic(await diagnoseLocalScreenshotOcr(file));}catch(diagError){showDiagnostic({diagnosticError:String(diagError)});}}}catch(error){clearAllReviewHighlights();setStatus(error instanceof Error?error.message:String(error),'error');try{showDiagnostic(await diagnoseLocalScreenshotOcr(file));}catch(diagError){showDiagnostic({importError:String(error),diagnosticError:String(diagError)});}}finally{button.disabled=false;button.textContent='Import Screenshot';}"
          if old not in s: raise SystemExit('import handler pattern not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit diagnostics and generated outputs
        run: |
          rm .github/workflows/apply-ocr-browser-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/import/localScreenshotOcr.ts src/ui/screenshotImport.ts build docs .github/workflows/apply-ocr-browser-diagnostics.yml
          git commit -m "Add browser OCR failure diagnostics [ocr-diagnostics]"
          git push origin HEAD:agent/ocr-browser-diagnostics
