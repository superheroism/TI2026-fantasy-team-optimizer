name: Refresh local OCR implementation
on:
  push:
    branches: [agent/screenshot-import-speed-confidence]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/screenshot-import-speed-confidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Add quality-bonus tier cross-check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          new="function tierMatch(s:string):{value:QualityTier;score:number}{const bonuses=[...s.matchAll(/([+-]?)(10|30|60|100|150)%/g)].map(m=>Number(m[2])),bonus=bonuses.find(v=>[10,30,60,100,150].includes(v)),byBonus:Record<number,QualityTier>={10:1,30:2,60:3,100:4,150:5};if(bonus&&byBonus[bonus])return{value:byBonus[bonus]!,score:.99};const m=s.toUpperCase().match(/\\b(?:III|IV|II|V|I)\\b/g)??[],v=m.find(x=>x!=='I')??m[0],map:Record<string,QualityTier>={I:1,II:2,III:3,IV:4,V:5};return v&&map[v]?{value:map[v]!,score:.82}:{value:1,score:.2};}"
          s2,n=re.subn(r'function tierMatch\(s:string\):\{value:QualityTier;score:number\}\{.*?\}\nfunction conf',new+'\nfunction conf',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'tierMatch replacement count={n}')
          p.write_text(s2)
          PY
      - run: npm run typecheck && npm run lint && npm run build
      - name: Commit source and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/import/localScreenshotOcr.ts build docs
          git commit -m "Cross-check OCR tiers and regenerate artifacts"
          git push origin HEAD:agent/screenshot-import-speed-confidence
