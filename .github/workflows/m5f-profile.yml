name: M5F Baseline Profile

on:
  push:
    paths:
      - '.github/m5f-profile-request'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out M5F branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build profile head
        run: |
          npm run typecheck
          npm run build

      - name: Run unchanged-kernel aggressive-only profile
        run: |
          node --expose-gc scripts/benchmark-m5e-target-case.mjs m5f-baseline-profile 3 aggressive none > benchmarks/m5f-baseline-profile.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('benchmarks/m5f-baseline-profile.json','utf8')); console.log(JSON.stringify({runtimeMs:r.runtimeMs,recommendationKey:r.recommendationKey,targetDiagnostics:r.targetDiagnostics},null,2));"

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: m5f-baseline-profile
          path: benchmarks/m5f-baseline-profile.json
