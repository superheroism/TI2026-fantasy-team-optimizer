name: M5E Generate Outputs

on:
  push:
    branches:
      - agent/m5e-terminal-composition
    paths:
      - .github/workflows/m5e-generate.yml
      - benchmarks/m5e-generate-run-request.txt

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build generated output
        run: npm run build

      - name: Upload regenerated files
        uses: actions/upload-artifact@v4
        with:
          name: m5e-generated-${{ github.run_id }}
          retention-days: 2
          path: |
            build/js/engine/engineExpectedScoring.js
            build/js/engine/engineExpectedScoring.js.map
            build/js/engine/title.js
            build/js/engine/title.js.map
            docs/js/engine/engineExpectedScoring.js
            docs/js/engine/engineExpectedScoring.js.map
            docs/js/engine/title.js
            docs/js/engine/title.js.map
