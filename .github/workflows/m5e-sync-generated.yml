name: M5E Sync Generated Output

on:
  push:
    paths:
      - '.github/m5e-sync-generated-request'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck and build generated output
        run: |
          npm run typecheck
          npm run build
      - name: Commit generated output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "M5E: regenerate exact target scoring output"
          git push
