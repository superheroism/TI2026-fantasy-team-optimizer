name: M6A Finalize Expanded Redistribution

on:
  push:
    branches:
      - agent/m6a-versioned-board-layout

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6a-versioned-board-layout

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Build generated artifacts
        run: npm run build

      - name: Run M6A authoritative comparison
        run: node scripts/benchmark-m6a-layout.mjs --json=benchmarks/m6a-layout-comparison.json

      - name: Run tests against regenerated artifacts
        run: node --test tests/*.test.mjs

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build docs benchmarks/m6a-layout-comparison.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "M6A: regenerate redistribution evidence"
            git push origin HEAD:agent/m6a-versioned-board-layout
          fi
