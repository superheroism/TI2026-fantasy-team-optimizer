name: M7B finalize release evidence

on:
  push:
    branches:
      - agent/m7b-v1-readiness-audit
    paths:
      - .github/workflows/m7b-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M7B branch
        uses: actions/checkout@v4
        with:
          ref: agent/m7b-v1-readiness-audit
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild and verify
        run: |
          npm run build
          npm run typecheck
          npm run verify:generated
          node --test tests/*.test.mjs
      - name: Record authoritative v1 route baseline
        run: node scripts/benchmark-m7b-v1.mjs
      - name: Finalize release documentation
        run: node scripts/finalize-m7b-docs.mjs
      - name: Commit final evidence and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m7b-finalize.yml scripts/finalize-m7b-docs.mjs
          git add build docs benchmarks/m7b-v1-production-baseline.json PERFORMANCE.md ENGINEERING_ROADMAP.md
          git commit -m "chore: freeze M7B v1 release evidence [skip ci]"
          git push origin HEAD:agent/m7b-v1-readiness-audit
