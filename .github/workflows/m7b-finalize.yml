name: M7B finalize release evidence

on:
  push:
    branches:
      - agent/m7b-v1-readiness-audit
    paths:
      - .github/workflows/m7b-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M7B branch
        uses: actions/checkout@v4
        with:
          ref: agent/m7b-v1-readiness-audit

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild and verify
        run: |
          npm run build
          npm run typecheck
          npm run verify:generated
          node --test tests/*.test.mjs

      - name: Record authoritative v1 route baseline
        run: node scripts/benchmark-m7b-v1.mjs

      - name: Append M7B performance summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='PERFORMANCE.md';
          let text=fs.readFileSync(path,'utf8');
          if(!text.includes('## M7B v1.0 production baseline')){
            const a=JSON.parse(fs.readFileSync('benchmarks/m7b-v1-production-baseline.json','utf8'));
            const rows=a.results.map(r=>`| ${r.layoutId} | ${r.objective.replace('_',' ')} | t=${r.tokens} | ${r.wallMs.toFixed(1)} ms | ${r.searchMode} | ${r.adaptiveStage??'—'} | ${r.exactFallback?'yes':'no'} | ${(r.memory.rssAfter/1024/1024).toFixed(1)} MiB |`).join('\n');
            text+=`\n\n## M7B v1.0 production baseline\n\nM7B freezes the v1 production horizon at **t<=2** and records all eight supported layout × objective × horizon routes on Node ${a.environment.node}/Linux. Each case runs in a fresh process against production data and the normal production entry point. Target-probability fixtures use 55k for legacy_3 and 75k for expanded_5 so neither layout is benchmarked only at a trivially saturated threshold. This is a release baseline, not a timing gate.\n\n| Layout | Objective | Horizon | Wall time | Route | Adaptive stage | Exact fallback | End RSS |\n|---|---|---:|---:|---|---|---|---:|\n${rows}\n\nAll eight route checks passed. legacy_3 remains exact at t=1/2; expanded_5 is exact at t=1 and uses the frozen M6E adaptive-tight policy at t=2, with exact fallback when required. No t=3/t=4 production route was benchmarked or exposed. Raw evidence: \`benchmarks/m7b-v1-production-baseline.json\`.\n`;
            fs.writeFileSync(path,text);
          }
          NODE

      - name: Append M7B roadmap outcome
        run: |
          if ! grep -q '^## M7B — v1.0 readiness audit and release contract' ENGINEERING_ROADMAP.md; then
            cat >> ENGINEERING_ROADMAP.md <<'EOF'


---

## M7B — v1.0 readiness audit and release contract

M7B closes as **PASS / v1.0 ready**. The production contract is frozen at modeled horizon `t<=2` for both supported layouts and both objectives. `legacy_3` is exact at t=0/1/2. `expanded_5` is exact at t=0/1 and uses the unchanged M6E-certified `adaptive-tight` route at t=2 with exact fallback. Deeper engineering machinery is not a production capability.

The audit found two narrow release-contract defects and fixed them without changing search mathematics: zero-token states now report modeled horizon t=0 and expose only stop, and the current visible menu now honors `menuRerollAvailable` while future-menu value-function semantics remain unchanged. Production statistical/title inputs now fail fast on incompatible structure/schema.

The authoritative Node 22 release matrix covers all eight layout × objective × t=1/2 routes; all route assertions pass. Existing M6F browser evidence continues to show optimizer work off the main thread with stale-result suppression and synchronous/worker parity. Cache review found no evidence requiring a new eviction policy; exact target pair/suffix caches are already bounded/weak, request-scoped search caches are naturally released, and persistent scoring caches are documented for post-v1 long-session observation.

**v1.0 blockers: none.** Lint/format/dead-code tooling and release tag/deployment mechanics are deferred as non-blocking release-process work. The M5H holdout remains untouched; target t=3 is not exposed; expanded_5 t=3 and t=4 were not begun; M6E policy parameters were not changed.

**Post-v1 sequencing:** deeper-horizon work requires a separately frozen research package. M7A remains the performance guidance: the likely frontier is frontier reduction, not another exact-cache layer.
EOF
          fi

      - name: Commit final evidence and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m7b-finalize.yml
          git add build docs benchmarks/m7b-v1-production-baseline.json PERFORMANCE.md ENGINEERING_ROADMAP.md
          git commit -m "chore: freeze M7B v1 release evidence [skip ci]"
          git push origin HEAD:agent/m7b-v1-readiness-audit
