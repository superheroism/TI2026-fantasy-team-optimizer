name: OCR corpus export

on:
  push:
    branches:
      - agent/ocr-regression-corpus

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect corpus
        run: |
          file tests/test_boards/*
          ls -lh tests/test_boards
      - name: Upload test boards
        uses: actions/upload-artifact@v4
        with:
          name: test-boards
          path: tests/test_boards
          if-no-files-found: error
