name: M6A source boundary patches

on:
  push:
    branches: [agent/m6a-versioned-board-layout]
    paths: ['.github/workflows/m6a-source-patches.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6a-versioned-board-layout
      - name: Correct scoring boundary patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/engine/scoring.ts')
          s=p.read_text()
          s=s.replace("  const corr=selectedCorrelation(banner.role,stats,data);\n  const legacyThree=corr.length===3,L=legacyThree?cholesky3(corr):cholesky(corr);\n  const evaluatedBanner=evaluateBanner(banner);", "  const corr=selectedCorrelation(banner.role,stats,data);\n  const evaluatedBanner=evaluateBanner(banner);")
          s=s.replace("const key=`${role}|${bannerMechanicsKey(banner,board.layoutId??DEFAULT_LAYOUT_ID)}|${iterations}`;;", "const key=`${role}|${bannerMechanicsKey(banner,layoutId)}|${iterations}`;;")
          p.write_text(s)
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/scoring.ts
          git diff --cached --quiet && exit 0
          git commit -m "M6A: correct scoring layout cache boundary"
          git push origin HEAD:agent/m6a-versioned-board-layout
