name: M6A finalize documentation

on:
  push:
    branches: [agent/m6a-versioned-board-layout]
    paths: ['.github/workflows/m6a-doc-finalize.yml']

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6a-versioned-board-layout
      - name: Record M6A architecture and performance conclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('ENGINEERING_ROADMAP.md')
          text = roadmap.read_text()
          marker = '## M6A — Versioned board-layout expansion'
          if marker not in text:
              text += '''\n\n---\n\n## M6A — Versioned board-layout expansion\n\nM6A interrupted the post-M5 deep-search sequence because the client geometry is expanding from three to five emblem slots per role. The engine now treats board geometry as ruleset/version data rather than a search invariant. `legacy_3` preserves the pre-M6A Core `R-G-R`, Mid `R-B-G`, and Support `B-G-B` geometry; `expanded_5` represents Core `R-G-R-G-R`, Mid `R-P-G-R-G`, and Support `P-G-P-G-P`. Purple is a physical slot color mapped to the existing blue-stat legality pool.\n\nLegacy compact IDs retain their original numeric namespace. Expanded board IDs occupy a disjoint versioned namespace, and layout identity is included in transition, scoring, target-preparation, and mechanics caches. The descriptive `BoardState` boundary remains explicit; old unversioned board objects resolve to `legacy_3`. Production remains pinned to `legacy_3` with modeled horizon `<=2`.\n\nThe authoritative M6A Node 22 matrix completed 12/12 cases with no errors or timeouts. Relative to `legacy_3`, `expanded_5` optimizer runtime was 1.22× at stat-heavy `t=1`, then 1.76× stat-heavy, 3.78× quality-heavy, 2.19× trait-heavy, 1.93× global-quality, and 1.64× target-probability at `t=2`. The dominant effect is frontier/branch growth rather than terminal-scoring cost: for the representative stat-heavy one-step transition, reachable outcomes rose from 5 to 21 while terminal scoring stayed roughly flat.\n\nOne expanded mechanic remains deliberately unresolved: the verified three-slot quality-redistribution rule decreases one slot and increases the other two, but current evidence does not define how the two increases are selected from four remaining slots on a five-slot banner. `expanded_5` therefore leaves that operation unavailable rather than guessing. This makes M6A **Outcome B** while preserving full legacy behavior.\n\n**Sequencing decision:** do not resume experimental target `t=3`, consume the untouched M5H holdout, or begin `t=4` yet. The new measurements make expanded-board `t=2` frontier containment the next problem to profile first; exact target-search reuse from M5H remains relevant, especially because target `t=2` still has the highest absolute cost in the M6A matrix, but the next package should be selected from the expanded frontier profile rather than assumed in advance.\n'''
              roadmap.write_text(text)

          perf = Path('PERFORMANCE.md')
          text = perf.read_text()
          marker = '## M6A versioned board-layout baseline'
          if marker not in text:
              text += '''\n\n## M6A versioned board-layout baseline\n\nM6A measured the 9→15 emblem expansion before attempting new search optimization. Authoritative runner: Node `v22.23.2`, Linux x64; base SHA `b058010829d7b48c5968d2540acf65a40b64f2a7`. Production controls remained `legacy_3`, horizon `<=2`; no new search approximation was introduced, M5H holdout data were not consumed, and neither target `t=3` nor `t=4` was run. The committed artifact is `benchmarks/m6a-layout-comparison.json`.\n\n| Workload | expanded / legacy optimizer runtime | Interpretation |\n|---|---:|---|\n| stat-heavy `t=1` | 1.22× | One-step overhead remains modest despite more reachable outcomes. |\n| stat-heavy `t=2` | 1.76× | Frontier growth is material at the production horizon. |\n| quality-heavy `t=2` | 3.78× | Largest measured relative expansion; random/global quality exposes many more five-slot states. |\n| trait-heavy `t=2` | 2.19× | Repeated-color/all-matching operations enlarge continuation breadth. |\n| global-quality `t=2` | 1.93× | Not perfectly apples-to-apples because unresolved expanded redistribution is intentionally unavailable. |\n| target-probability `t=2` | 1.64× | Expanded run ≈6.75 s vs legacy ≈4.12 s on this runner. |\n\nThe stat-heavy `t=1` probe makes the source of growth concrete: a representative Core green-stat transition increased from **5 reachable outcomes** on `legacy_3` to **21** on `expanded_5`, while terminal scoring remained approximately flat (~147 ms legacy vs ~151 ms expanded in the same benchmark process). Codec round-trip cost increased modestly (~4.66 µs to ~5.75 µs per encode/decode loop). This points away from the N-dimensional scoring kernel as the primary problem and toward transition branching, unique compact states, and downstream terminal evaluations.\n\nTarget-probability `t=2` completed on both layouts after layout identity was propagated through the target candidate-preparation cache. The expanded run used about **9,885 target scalar states** and completed in **~6.75 s**; the legacy comparison completed in **~4.12 s**. This remains the highest absolute-cost workload in the matrix, so the exact-reuse opportunity identified by M5H is still important even though the immediate 9→15 expansion also creates substantial expected-score frontier growth.\n\nThe benchmark completed **12/12** matrix cases with **0 errors and 0 timeouts**. M6A therefore establishes a usable expanded-board baseline rather than a performance workaround. No M5C/M5D policy was retuned.\n'''
              perf.write_text(text)

          doc = Path('M6A_VERSIONED_BOARD_LAYOUT.md')
          text = doc.read_text()
          text = text.replace('**Status:** implementation / validation', '**Status:** complete — Outcome B')
          old = 'Authoritative Node 22 CI and benchmark evidence is recorded in the final section once the branch benchmark completes.'
          text = text.replace(old, 'Authoritative Node 22 validation completed the full 12-case layout matrix with zero errors or timeouts. The expanded/legacy optimizer-runtime ratios were 1.22× for stat-heavy `t=1`; and at `t=2`, 1.76× stat-heavy, 3.78× quality-heavy, 2.19× trait-heavy, 1.93× global-quality, and 1.64× target-probability. Representative stat-heavy transition branching rose from 5 to 21 outcomes while terminal scoring stayed approximately flat, identifying frontier growth as the primary expansion cost.')
          text = text.replace('Final classification is **Outcome B** if the architecture/legacy gates pass while five-slot quality-redistribution semantics remain unverified. It becomes Outcome A only if authoritative client evidence resolves that operation within M6A without guessing.', 'Final classification: **Outcome B**. Architecture, compatibility, expanded-layout, and benchmark gates pass, while five-slot quality-redistribution target-selection semantics remain unverified and are therefore disabled for `expanded_5`. Production remains `legacy_3` / `t<=2`.')
          doc.write_text(text)
          PY
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ENGINEERING_ROADMAP.md PERFORMANCE.md M6A_VERSIONED_BOARD_LAYOUT.md
          git commit -m "docs: record M6A Outcome B and expanded baseline"
          git push origin HEAD:agent/m6a-versioned-board-layout
