name: OCR field hardening branch build

on:
  push:
    branches:
      - agent/ocr-field-extraction-hardening
    paths:
      - .github/workflows/ocr-field-hardening-build.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ocr-field-extraction-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Wire token-aware matching into production importer
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/import/localScreenshotOcr.ts')
          s=p.read_text()
          s=s.replace("import { ACTION_CATALOG } from '../data/actionCatalog.js';\n", "")
          anchor="import type { RawScreenshotImport, ScreenshotFieldConfidence } from './screenshotImport.js';\n"
          s=s.replace(anchor, anchor+"import { matchActionText, matchStatText, matchTierText, matchTraitText } from './ocrDomainMatch.js';\n")
          old="""function statMatch(s:string,legal:readonly StatName[]){let best={value:legal[0]!,score:-1};for(const v of legal){const score=Math.max(...ALIASES[v].map(a=>sim(s,a)));if(score>best.score)best={value:v,score};}return best;}
          function traitMatch(s:string){let best={value:TRAITS[0]!,score:-1};for(const v of TRAITS){const score=sim(s,v);if(score>best.score)best={value:v,score};}return best;}
          function tierMatch(s:string):{value:QualityTier;score:number}{const bonuses=[...s.matchAll(/([+-]?)(10|30|60|100|150)%/g)].map(m=>Number(m[2])),bonus=bonuses.find(v=>[10,30,60,100,150].includes(v)),byBonus:Record<number,QualityTier>={10:1,30:2,60:3,100:4,150:5};if(bonus&&byBonus[bonus])return{value:byBonus[bonus]!,score:.99};const m=s.toUpperCase().match(/\\b(?:III|IV|II|V|I)\\b/g)??[],v=m.find(x=>x!=='I')??m[0],map:Record<string,QualityTier>={I:1,II:2,III:3,IV:4,V:5};return v&&map[v]?{value:map[v]!,score:.82}:{value:1,score:.2};}
          """
          new="""function statMatch(s:string,legal:readonly StatName[]){return matchStatText(s,legal);}
          function traitMatch(s:string){return matchTraitText(s);}
          function tierMatch(s:string):{value:QualityTier;score:number}{return matchTierText(s);}
          """
          if old not in s: raise SystemExit('domain matcher block not found')
          s=s.replace(old,new)
          old_action="function actionMatch(s:string){return ACTION_CATALOG.map(a=>({id:a.id,score:sim(s,a.label)})).sort((a,b)=>b.score-a.score)[0];}"
          if old_action not in s: raise SystemExit('action matcher not found')
          s=s.replace(old_action,"function actionMatch(s:string){return matchActionText(s);}")
          old_decl="const fc:ScreenshotFieldConfidence[]=[],warnings:string[]=[],banners={} as RawScreenshotImport['banners'],emblemDiagnostics:EmblemOcrDiagnostic[]=[],teamEvidence={} as ScreenshotGeometryDiagnostic['teamEvidence'];\n  let synthesizedRows=pooledResult.synthesized;"
          new_decl="const fc:ScreenshotFieldConfidence[]=[],warnings:string[]=[],banners={} as RawScreenshotImport['banners'],emblemDiagnostics:EmblemOcrDiagnostic[]=[],teamEvidence={} as ScreenshotGeometryDiagnostic['teamEvidence'];\n  const geometryConfidenceCap=localGeometry.method==='fallback'||extractionGeometry.method==='fallback'?.85:1;\n  if(localGeometry.method==='fallback') warnings.push('Board localization used conservative fallback geometry; imported board fields require review.');\n  if(extractionGeometry.method==='fallback') warnings.push('Board columns used conservative fallback geometry; imported board fields require review.');\n  let synthesizedRows=pooledResult.synthesized;"
          if old_decl not in s: raise SystemExit('declaration block not found')
          s=s.replace(old_decl,new_decl)
          old_team="for(const role of ROLES){const b=bs[role],rs=rows[role],first=rs[0]??ex.height*.2,tw=within(ex.words,b.left,b.left+(b.right-b.left)*.58,0,Math.max(first-5,ex.height*.24)),tm=teamMatch(tw,role,data);teamEvidence[role]={rawText:text(tw),normalizedTeam:tm.team,matchScore:tm.score};fc.push({path:`banners.${role}.selectedTeam`,confidence:tm.score});if(tm.score<.9)warnings.push(`${role} team OCR should be reviewed.`);"
          new_team="for(const role of ROLES){const b=bs[role],rs=rows[role],first=rs[0]??ex.height*.2,bandWidth=b.right-b.left,emblemLeft=b.left+bandWidth*.42,pitch=rs.length>1?Math.abs(rs[1]!-rs[0]!):Math.max(55,ex.height*.08),tw=within(ex.words,Math.max(0,b.left-bandWidth*.08),Math.max(b.left,emblemLeft-bandWidth*.03),0,Math.min(ex.height,first+pitch*.7)),tm=teamMatch(tw,role,data),teamConfidence=Math.min(tm.score,geometryConfidenceCap);teamEvidence[role]={rawText:text(tw),normalizedTeam:tm.team,matchScore:tm.score};fc.push({path:`banners.${role}.selectedTeam`,confidence:teamConfidence});if(teamConfidence<.9)warnings.push(`${role} team OCR should be reviewed.`);"
          if old_team not in s: raise SystemExit('team extraction block not found')
          s=s.replace(old_team,new_team)
          old_conf="sm=statMatch(s,LEGAL_STAT_POOLS[slot.color]),tr=traitMatch(s),qt=tierMatch(s),sc=conf(sm.score,ww),tc=conf(tr.score,ww),finalConfidence=Math.min(sc,qt.score,tc);fc.push({path:`banners.${role}.emblems.${i}.stat`,confidence:sc},{path:`banners.${role}.emblems.${i}.qualityTier`,confidence:qt.score},{path:`banners.${role}.emblems.${i}.trait`,confidence:tc});"
          new_conf="sm=statMatch(s,LEGAL_STAT_POOLS[slot.color]),tr=traitMatch(s),qt=tierMatch(s),sc=Math.min(conf(sm.score,ww),geometryConfidenceCap),tc=Math.min(conf(tr.score,ww),geometryConfidenceCap),qc=Math.min(qt.score,geometryConfidenceCap),finalConfidence=Math.min(sc,qc,tc);fc.push({path:`banners.${role}.emblems.${i}.stat`,confidence:sc},{path:`banners.${role}.emblems.${i}.qualityTier`,confidence:qc},{path:`banners.${role}.emblems.${i}.trait`,confidence:tc});"
          if old_conf not in s: raise SystemExit('emblem confidence block not found')
          s=s.replace(old_conf,new_conf)
          old_actions="const actionRows=pooled.length?pooled:ROLES.flatMap(r=>rows[r]),actions=await parseActions(worker,img,ex,crop,actionRows,fc,warnings),tokens=tokenCount(ex.words),result:RawScreenshotImport={layoutId,banners,operationIds:actions.ops,fieldConfidence:fc,warnings};"
          new_actions="const actionRows=pooled.length?pooled:ROLES.flatMap(r=>rows[r]),actions=await parseActions(worker,img,ex,crop,actionRows,fc,warnings),tokens=tokenCount(ex.words);if(geometryConfidenceCap<1){for(const field of fc)if(field.path.startsWith('operationIds.'))field.confidence=Math.min(field.confidence,geometryConfidenceCap);}const result:RawScreenshotImport={layoutId,banners,operationIds:actions.ops,fieldConfidence:fc,warnings};"
          if old_actions not in s: raise SystemExit('actions/result block not found')
          s=s.replace(old_actions,new_actions)
          p.write_text(s)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/ocr-domain-match.test.mjs tests/screenshot-import.test.mjs
      - name: Commit source, generated artifacts, and remove temporary workflow
        run: |
          rm .github/workflows/ocr-field-hardening-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/import/localScreenshotOcr.ts src/import/ocrDomainMatch.ts tests/ocr-domain-match.test.mjs build docs .github/workflows/ocr-field-hardening-build.yml
          git commit -m "Harden screenshot OCR field extraction"
          git push
